<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Questões - Pontos Fracos</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Questões</h1>
      <p>Treino aleatório</p>
    </div>
    <button id="configButton" type="button" class="topbar-button">Config</button>
  </header>

  <main class="app-shell">
    <section class="question-card" id="questionCard">
      <div class="empty-state">
        <h2>Carregando questões</h2>
        <p>O treino usa ordem aleatória e só mostra estatísticas depois da resposta.</p>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
