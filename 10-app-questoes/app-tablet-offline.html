- `I0=\\bar{C}`, `I1=C`, `I2=C`, `I3=1`\n* `I0=C`, `I1=\\bar{C}`, `I2=0`, `I3=1`\n- `I0=1`, `I1=\\bar{C}`, `I2=0`, `I3=C`\n- `I0=C`, `I1=0`, `I2=\\bar{C}`, `I3=1`\n> Para `AB=00`, mintermos 0/1: só 1 é 1, então `I0=C`. Para `01`, mintermos 2/3: só 2 é 1, então `I1=\\bar{C}`. Para `10`, nenhum; `I2=0`. Para `11`, ambos 6/7; `I3=1`.\n\n===\n@id novo100-q014\n# decoder; ativo baixo; enable\n? Um decoder 3:8 possui saídas ativas em nível baixo e enable ativo alto. Com `E=1` e entrada `101`, qual saída deve indicar seleção?\n- `Y5=1`, todas as outras `0`\n- `Y2=0`, todas as outras `1`\n- `Y5=Z`, todas as outras `0`\n* `Y5=0`, todas as outras `1`\n- Nenhuma saída é selecionada porque ativo baixo desabilita o circuito.\n> Entrada `101` seleciona índice 5. Como as saídas são ativas baixas, a selecionada vai para 0 e as demais ficam em 1.\n\n===\n@id novo100-q015\n# encoder; prioridade; valid\n? Um priority encoder 4:2 dá prioridade para a entrada de maior índice. Para `D3D2D1D0 = 1011`, qual saída de código e `valid` são esperados?\n- Código `00`, `valid=1`, pois `D0` está ativo.\n- Código `01`, `valid=1`, pois há mais de uma entrada ativa.\n- Código `10`, `valid=1`, pois `D2` é a maior entrada ativa.\n- Código indefinido e `valid=0`, pois encoder não aceita múltiplas entradas.\n* Código `11`, `valid=1`, pois `D3` tem prioridade.\n> Em priority encoder, múltiplas entradas ativas não tornam a saída inválida; vence a de maior prioridade. Aqui `D3=1`, então código `11` e `valid=1`.\n\n===\n@id novo100-q016\n# comparador; signed; magnitude\n? Compare `A=1001` e `B=0111`. Qual alternativa está correta em 4 bits?\n* Como unsigned, `A>B`; como signed em complemento de 2, `A<B`.\n- Como unsigned, `A<B`; como signed, `A>B`.\n- Nas duas interpretações, `A>B`.\n- Nas duas interpretações, `A<B`.\n- A comparação signed não pode ser feita porque `A` tem MSB 1.\n> Unsigned: `A=9` e `B=7`. Signed: `A=-7` e `B=+7`. A mesma sequência de bits pode mudar totalmente a comparação.\n\n===\n@id novo100-q017\n# barramento; alta impedância; contenção\n? Dois circuitos compartilham um barramento. No mesmo instante, um dirige `1010`, outro dirige `ZZZZ` e um terceiro dirige `1000`. O que é correto dizer?\n- O valor final é `1010`, pois `Z` não interfere e o terceiro é ignorado.\n* Há contenção nos bits em que os dois drivers ativos discordam.\n- `Z` vale 0, então o barramento vira `0000`.\n- O barramento soma os valores e vira `0010`.\n- Não há problema porque pelo menos um driver está em alta impedância.\n> Alta impedância significa desconectado, mas há dois drivers ativos: `1010` e `1000`. Eles discordam no bit 1, causando contenção elétrica.\n\n===\n@id novo100-q018\n# fsm; moore; mealy; latência\n? Um detector deve produzir saída 1 assim que a sequência `101` aparece, permitindo sobreposição. Qual afirmação diferencia corretamente uma implementação Moore de uma Mealy?\n- Moore pode ativar a saída na mesma transição que lê o último bit, pois saída depende da entrada.\n- Mealy só ativa a saída no ciclo seguinte, pois saída depende apenas do estado.\n* Mealy pode ativar na transição que lê o último bit; Moore normalmente precisa chegar a um estado de detecção.\n- Moore e Mealy sempre terão exatamente o mesmo número de estados e mesma latência.\n- Mealy não pode detectar sequência com sobreposição.\n> Em Mealy, a saída depende de estado atual e entrada, então pode reagir no ciclo do último bit. Em Moore, a saída depende do estado alcançado.\n\n===\n@id novo100-q019\n# fsm; sequência; sobreposição\n? Uma FSM Mealy detecta `110` com sobreposição. Após a entrada serial `1110`, quantas detecções devem ocorrer?\n- 0, porque a sequência começa com dois 1s e há três 1s seguidos.\n- 1, apenas nos três primeiros bits.\n- 2, nas janelas `111` e `110`.\n* 1, na janela formada pelos bits 2, 3 e 4.\n- 3, uma para cada transição após o segundo bit.\n> As janelas de tamanho 3 são `111` e `110`. Apenas a segunda é `110`. Sobreposição permite reaproveitar bits, mas não cria detecção onde o padrão não aparece.\n\n===\n@id novo100-q020\n# fsm; codificação; flip-flop d\n? Uma FSM tem estados codificados `S0=00`, `S1=01`, `S2=10`. Para entrada `X=1`, as transições são `S0->S1`, `S1->S2`, `S2->S0`. Qual linha de próximo estado está correta?\n- Em `S1`, `D1D0=01`, pois D recebe o estado atual.\n- Em `S2`, `D1D0=11`, pois estado não usado deve ser escolhido.\n- Em `S0`, `D1D0=00`, pois reset mantém o estado.\n- Em `S1`, `D1D0=11`, pois a entrada `X=1` deve ser concatenada ao estado.\n* Em `S1`, `D1D0=10`, pois FF D recebe o próximo estado.\n> Em flip-flop D, as entradas D são exatamente os bits do próximo estado. Se `S1=01` vai para `S2=10`, então `D1D0=10`.\n\n===\n@id novo100-q021\n# latch; flip-flop; transparência\n? Um latch D ativo em nível alto recebe `D=1` enquanto `EN=1`, depois `D` muda para 0 ainda com `EN=1`, e só depois `EN` vai a 0. O valor armazenado ao final é:\n* `0`, porque o latch ficou transparente enquanto `EN=1`.\n- `1`, porque o primeiro valor visto pelo latch sempre fica salvo.\n- Indefinido, porque latch não armazena valor.\n- `1`, se a mudança de D não ocorreu em borda de clock.\n- Sempre `Z`, pois enable baixo desconecta a saída.\n> Latch é sensível a nível. Enquanto habilitado, Q acompanha D; ao desabilitar, guarda o último valor presente.\n\n===\n@id novo100-q022\n# sr latch; ativo baixo; nand\n? Em um latch SR feito com NAND, entradas `\\bar{S}` e `\\bar{R}` são ativas em 0. Qual combinação é proibida?\n- `\\bar{S}=1`, `\\bar{R}=1`\n* `\\bar{S}=0`, `\\bar{R}=0`\n- `\\bar{S}=0`, `\\bar{R}=1`\n- `\\bar{S}=1`, `\\bar{R}=0`\n- Nenhuma, pois NAND elimina condição inválida.\n> No latch SR com NAND, as entradas são ativas baixas. Colocar ambas em 0 força simultaneamente set e reset, levando à condição inválida.\n\n===\n@id novo100-q023\n# registradores; pipo; piso; sipo; siso\n? Um circuito recebe 8 bits ao mesmo tempo e deve transmiti-los um por ciclo por uma única linha. Que tipo de registrador de deslocamento descreve melhor essa função?\n- SIPO, entrada serial e saída paralela.\n- PIPO, entrada paralela e saída paralela.\n* PISO, entrada paralela e saída serial.\n- SISO, entrada serial e saída serial.\n- FIFO, pois qualquer transmissão serial é FIFO.\n> Entrada paralela e saída serial é PISO. FIFO descreve ordem de armazenamento, não necessariamente o modo físico de entrada/saída.\n\n===\n@id novo100-q024\n# fifo; ponteiros; condição cheia\n? Uma FIFO circular de 8 posições usa ponteiros de escrita e leitura de 3 bits e deixa uma posição vazia para distinguir cheia de vazia. Se `wr=101` e `rd=110`, qual condição isso representa?\n- Vazia, porque `wr` e `rd` são quase iguais.\n- Cheia, porque `wr+1` módulo 8 é `110`.\n- Meio cheia, porque há quatro posições ocupadas.\n* Cheia, porque o próximo endereço de escrita coincide com `rd`.\n- Inválida, porque FIFO precisa ter potência de 2 maior que 8.\n> Com a convenção de uma posição vazia, FIFO cheia quando `(wr+1) mod N = rd`. Aqui `101+1=110`, igual a `rd`.\n\n===\n@id novo100-q025\n# contador síncrono; módulo; estados não usados\n? Um contador síncrono módulo 6 usa 3 flip-flops e conta `000,001,010,011,100,101,000...`. Qual afirmação é correta?\n- Usa todos os 8 estados possíveis dos 3 flip-flops.\n- Precisa necessariamente de 6 flip-flops.\n- Estados `110` e `111` são válidos e devem aparecer na sequência.\n- É obrigatoriamente assíncrono porque módulo não é potência de 2.\n* Usa 6 estados válidos; `110` e `111` precisam ser tratados ou evitados.\n> Três FFs permitem 8 estados, mas o módulo 6 usa apenas 6. Os estados não usados podem ser tratados com reset/lógica de recuperação.\n\n===\n@id novo100-q026\n# ring counter; johnson; reconhecimento\n? Com 5 flip-flops inicializados corretamente, quantos estados úteis têm um contador em anel simples e um contador Johnson?\n* Ring: 5; Johnson: 10\n- Ring: 10; Johnson: 5\n- Ring: 32; Johnson: 32\n- Ring: 4; Johnson: 8\n- Ring: 5; Johnson: 32\n> Ring counter com `n` FFs circula um único 1 e tem `n` estados úteis. Johnson realimenta o complemento e tem `2n` estados úteis.\n\n===\n@id novo100-q027\n# temporização; setup; fmax\n? Um caminho registrador-para-registrador tem `tCQmax=0,7 ns`, lógica máxima de `5,8 ns`, `tsetup=0,6 ns` e skew de captura favorável de `+0,4 ns` (clock chega mais tarde no destino). Qual é o menor período de clock para setup?\n- `7,5 ns`\n* `6,7 ns`\n- `7,1 ns`\n- `6,3 ns`\n- `5,7 ns`\n> Para setup: `T >= tCQmax + tPDmax + tsetup - skew`. Como o skew é favorável, subtrai: `0,7+5,8+0,6-0,4 = 6,7 ns`.\n\n===\n@id novo100-q028\n# temporização; hold; skew\n? No mesmo estilo, um caminho tem `tCQmin=0,25 ns`, lógica mínima `0,35 ns`, `thold=0,8 ns`. O clock chega `0,3 ns` mais tarde no destino. Há violação de hold?\n- Não, pois hold melhora quando o clock do destino atrasa.\n- Não, pois basta reduzir a frequência.\n* Sim, porque `0,25+0,35` é menor que `0,8+0,3`.\n- Sim, porque setup e hold usam sempre atraso máximo.\n- Não, porque `0,25+0,35+0,3` é maior que `0,8`.\n> Para hold, o dado não pode chegar cedo demais: `tCQmin+tPDmin >= thold + skew`. Aqui `0,60 >= 1,10` é falso, então há violação.\n\n===\n@id novo100-q029\n# pipeline; caminho crítico; overhead de registrador\n? Um circuito combinacional de 18 ns é dividido em três estágios de 6 ns por registradores com overhead total por estágio de 1 ns. Desconsiderando hazards, qual Fmax aproximada do pipeline?\n- `55,6 MHz`, pois usa o atraso total de 18 ns.\n- `166,7 MHz`, pois considera só os 6 ns de lógica.\n- `333,3 MHz`, pois são três estágios.\n* `142,9 MHz`, pois o estágio fica com período mínimo de 7 ns.\n- `1 GHz`, pois pipeline elimina caminho crítico.\n> O período mínimo do pipeline é o maior atraso de estágio mais overhead: `6+1=7 ns`. Logo `Fmax≈1/7 ns≈142,9 MHz`.\n\n===\n@id novo100-q030\n# metastabilidade; sincronizador; entrada assíncrona\n? Um botão externo assíncrono entra diretamente em uma FSM síncrona. Qual solução reduz o risco de metastabilidade antes da FSM?\n- Aumentar fanout do sinal do botão.\n- Colocar uma porta XOR antes da entrada.\n- Reduzir a frequência de clock para zero durante a leitura.\n- Trocar a FSM Moore por Mealy.\n* Usar dois flip-flops em série no domínio de clock da FSM.\n> Um sincronizador de dois FFs reduz muito a probabilidade de metastabilidade se propagar. Não elimina matematicamente o risco, mas é a técnica clássica.\n\n===\n@id novo100-q031\n# ponto fixo; q-format; complemento de 2\n? Um valor em `Q3.4` signed ocupa 8 bits em complemento de 2. O padrão `1110 1000` representa:\n* `-1,5`\n- `+14,5`\n- `-2,5`\n- `-24`\n- `+1,5`\n> Interprete primeiro como inteiro signed de 8 bits: `11101000` vale -24. Em `Q3.4`, divide por `2^4=16`: `-24/16=-1,5`.\n\n===\n@id novo100-q032\n# ponto fixo; saturação; overflow\n? Em `Q2.2` signed de 5 bits totais, a faixa é de `-4,00` a `+3,75`. Se a soma real de dois valores dá `+4,25`, qual comportamento é correto se o enunciado pedir saturação?\n- Arredondar para `+4,00`.\n* Guardar `+3,75`, o maior valor representável.\n- Fazer wrap-around para um valor negativo, pois saturação e overflow são iguais.\n- Guardar `10001`, pois MSB 1 significa positivo saturado.\n- Dividir o resultado por 2 para caber.\n> Em saturação, quando o resultado passa da faixa, prende no limite mais próximo. O máximo em `Q2.2` é `+3,75`.\n\n===\n@id novo100-q033\n# ieee 754; expoente; normalização\n? Um float simplificado tem 1 bit de sinal, 4 bits de expoente com bias 7 e fração de 3 bits com `1` implícito para normalizados. O padrão `0 1001 010` representa:\n- `+2,25`\n- `+4,5`\n* `+5,0`\n- `+10,0`\n- `+0,625`\n> Expoente armazenado `1001=9`, expoente real `9-7=2`. Fração `010` dá significando `1,010₂=1,25`. Valor `1,25*2^2=5,0`.\n\n===\n@id novo100-q034\n# ieee 754; casos especiais; subnormal\n? Em IEEE 754 simples, qual padrão de expoente e fração caracteriza um número subnormal?\n- Expoente `11111111` e fração zero.\n- Expoente `11111111` e fração diferente de zero.\n- Expoente diferente de zero e fração qualquer.\n* Expoente `00000000` e fração diferente de zero.\n- Expoente `00000000` e fração zero, com sinal 1.\n> Expoente 0 com fração diferente de zero indica subnormal. Expoente 0 com fração zero é zero; expoente 255 indica infinito ou NaN.\n\n===\n@id novo100-q035\n# somador; carry-lookahead; generate-propagate\n? Usando `G_i=A_iB_i` e `P_i=A_i xor B_i`, qual expressão de carry está correta para `C2` em um somador lookahead?\n- `C2 = G0 + P0G1 + P0P1C0`\n- `C2 = P1 + G1P0 + G0C0`\n- `C2 = G1P1 + G0P0 + C0`\n- `C2 = A2B2 + P2C1`\n* `C2 = G1 + P1G0 + P1P0C0`\n> `C1=G0+P0C0`. Então `C2=G1+P1C1 = G1+P1G0+P1P0C0`.\n\n===\n@id novo100-q036\n# subtração; borrow; carry\n? Em uma ULA, `A-B` unsigned é implementado como `A + \\bar{B} + 1`. Se `A=0011` e `B=0101`, qual interpretação do carry-out final é correta?\n* Carry-out 0 indica que houve borrow; o resultado de 4 bits é `1110`.\n- Carry-out 1 indica borrow e resultado `1110`.\n- Carry-out 1 indica que não houve borrow; resultado `0010`.\n- Carry-out 0 indica overflow assinado obrigatório.\n- Borrow só existe quando os dois operandos têm MSB 1.\n> `3-5=-2`, em 4 bits fica `1110`. Na implementação por complemento de 2 para unsigned, carry-out final 0 indica empréstimo/borrow.\n\n===\n@id novo100-q037\n# ula; flags; zero negativo carry overflow\n? A operação de 4 bits `0111 + 0001` gera `1000`. Quais flags são coerentes para interpretação signed?\n- `Z=1`, `N=0`, `V=0`\n* `Z=0`, `N=1`, `V=1`\n- `Z=0`, `N=1`, `V=0`\n- `Z=0`, `N=0`, `V=1`\n- `Z=1`, `N=1`, `V=1`\n> `7+1=8`, fora da faixa signed de 4 bits (`-8` a `+7`). Resultado `1000` tem MSB 1, então `N=1`; não é zero; houve overflow.\n\n===\n@id novo100-q038\n# shifter; aritmético; lógico\n? O padrão `1001 0110` é deslocado uma posição à direita. Qual par representa, respectivamente, shift lógico e shift aritmético?\n- `1100 1011` e `0100 1011`\n- `0100 1011` e `0100 1011`\n* `0100 1011` e `1100 1011`\n- `1001 0110` e `1100 1011`\n- `0000 1011` e `1111 1011`\n> Shift lógico à direita insere 0 no MSB. Shift aritmético à direita replica o bit de sinal, que aqui é 1.\n\n===\n@id novo100-q039\n# cmos; pull-down; função lógica\n? Em uma porta CMOS estática, a rede NMOS pull-down conduz quando `(A+B)C=1`. Qual é a função lógica da saída?\n- `F=(A+B)C`\n- `F=A+B+C`\n- `F=\\bar{A}+\\bar{B}+\\bar{C}`\n* `F=\\bar{(A+B)C}`\n- `F=\\bar{A}+\\bar{B}+C`\n> Se o pull-down conduz, a saída vai a 0. Portanto a saída é o complemento da condição de condução da rede NMOS: `F=\\bar{(A+B)C}`.\n\n===\n@id novo100-q040\n# cmos; pmos; nmos; níveis fortes\n? Um NMOS usado isoladamente como chave de passagem tenta transmitir nível lógico 1. Qual problema clássico aparece?\n- Ele transmite 1 forte até `VDD` sem perda.\n- Ele transmite 0 fraco e 1 forte.\n- Ele sempre coloca a saída em alta impedância.\n- Ele inverte o valor automaticamente.\n* Ele tende a transmitir 1 fraco, limitado por tensão de limiar.\n> NMOS passa 0 forte, mas passa 1 fraco. PMOS é o complementar: passa 1 forte e 0 fraco.\n\n===\n@id novo100-q041\n# potência dinâmica; unidades; atividade\n? Um nó com `C=20 fF`, `VDD=1,0 V`, atividade `α=0,25` e `f=200 MHz` tem potência dinâmica aproximada:\n* `1 µW`\n- `1 mW`\n- `100 µW`\n- `10 µW`\n- `0,1 W`\n> `P=αCV²f = 0,25 * 20e-15 * 1² * 200e6 = 1e-6 W`, isto é, `1 µW`.\n\n===\n@id novo100-q042\n# potência; energia; frequência\n? Dois blocos têm mesma capacitância e atividade. O bloco B usa `VDD` 20% menor e frequência 25% maior. A razão `P_B/P_A` é:\n- `1,56`\n* `0,80`\n- `1,00`\n- `1,25`\n- `0,64`\n> Potência dinâmica escala com `V²f`. Logo `(0,8)² * 1,25 = 0,64*1,25 = 0,80`.\n\n===\n@id novo100-q043\n# atraso; fanout; carga capacitiva\n? Uma porta passa a dirigir quatro entradas idênticas em vez de uma. Mantendo a mesma porta de saída, o efeito esperado é:\n- Menor atraso, pois o sinal se distribui em paralelo.\n- Menor potência dinâmica, pois cada entrada recebe menos carga.\n* Maior atraso e maior potência dinâmica por aumento da carga capacitiva.\n- Nenhuma mudança, pois fanout afeta apenas lógica sequencial.\n- Saída em alta impedância obrigatória.\n> Mais fanout significa mais capacitância sendo carregada e descarregada. Isso aumenta atraso e energia dinâmica.\n\n===\n@id novo100-q044\n# hazard; consenso; sop\n? A expressão `F=AB+\\bar{A}C` pode ter hazard estático-1 quando `B=C=1` e `A` muda. Qual termo de consenso remove esse hazard sem alterar a função?\n- `A\\bar{C}`\n- `\\bar{A}B`\n- `A\\bar{B}`\n* `BC`\n- `\\bar{B}\\bar{C}`\n> Para `XY + \\bar{X}Z`, o termo de consenso é `YZ`. Aqui, `AB+\\bar{A}C` recebe o termo `BC`.\n\n===\n@id novo100-q045\n# glitch; flip-flop; janela de captura\n? Um glitch estreito aparece em uma lógica combinacional entre dois flip-flops. Qual afirmação é mais correta?\n- Todo glitch sempre será armazenado no próximo flip-flop.\n- Glitch nunca importa em circuito síncrono.\n- Glitch é a mesma coisa que metastabilidade.\n- Glitch só existe em portas NOR.\n* Ele só causa erro funcional se afetar a entrada capturada dentro da janela relevante de setup/hold.\n> Glitches podem ser filtrados pelo tempo se não estiverem presentes quando o flip-flop captura. Mas podem causar erro se chegarem na janela crítica.\n\n===\n@id novo100-q046\n# memória; capacidade; endereços\n? Uma memória `16K x 12` tem quantas linhas de endereço e qual capacidade total em bytes?\n* 14 linhas de endereço e 24 KiB.\n- 16 linhas de endereço e 12 KiB.\n- 14 linhas de endereço e 16 KiB.\n- 12 linhas de endereço e 24 KiB.\n- 15 linhas de endereço e 32 KiB.\n> `16K = 16*1024 = 2^14`, então 14 linhas de endereço. Capacidade: `16384*12 = 196608 bits = 24576 bytes = 24 KiB`.\n\n===\n@id novo100-q047\n# memória; byte; word; endereçamento\n? Um processador endereça bytes. Um vetor de palavras de 32 bits começa no endereço `0x1000`. Qual endereço do elemento de índice 7?\n- `0x1007`\n* `0x101C`\n- `0x1014`\n- `0x1020`\n- `0x100E`\n> Cada palavra de 32 bits tem 4 bytes. Índice 7 desloca `7*4=28` bytes, isto é, `0x1C`. Endereço: `0x1000+0x1C=0x101C`.\n\n===\n@id novo100-q048\n# memória; sram; dram; rom\n? Qual alternativa compara corretamente SRAM, DRAM e ROM?\n- SRAM não é volátil porque não precisa refresh.\n- DRAM é não volátil porque armazena carga em capacitor.\n* SRAM é volátil e não precisa refresh; DRAM é volátil e precisa refresh; ROM é não volátil.\n- ROM precisa refresh, mas não permite escrita.\n- SRAM é sempre mais densa que DRAM.\n> SRAM não precisar refresh não a torna não volátil. DRAM precisa refresh; ROM preserva informação sem energia.\n\n===\n@id novo100-q049\n# rom; tabela verdade; lut\n? Uma ROM usada como tabela verdade tem 5 entradas lógicas e 3 saídas. Qual organização mínima corresponde diretamente a essa função?\n- `5 x 3`\n- `3 x 5`\n- `16 x 3`\n* `32 x 3`\n- `8 x 32`\n> 5 entradas selecionam `2^5=32` endereços. Cada endereço precisa armazenar 3 bits de saída.\n\n===\n@id novo100-q050\n# lut; fpga; bits de configuração\n? Uma LUT de 6 entradas implementa uma função booleana qualquer dessas entradas. Quantos bits de configuração são necessários para a tabela da LUT?\n- 6\n- 12\n- 32\n- 128\n* 64\n> Uma LUT de `k` entradas tem uma posição para cada combinação de entrada: `2^k`. Para `k=6`, são 64 bits.\n\n===\n@id novo100-q051\n# pla; pal; prom; flexibilidade\n? Qual comparação entre PROM, PAL e PLA está correta?\n* PROM tem plano AND fixo e OR programável; PAL tem AND programável e OR fixo; PLA tem ambos programáveis.\n- PROM tem ambos os planos programáveis; PAL é a mais flexível.\n- PAL tem AND fixo e OR programável; PLA é uma ROM.\n- PLA tem apenas LUTs e flip-flops; PROM usa macrocélulas.\n- PROM, PAL e PLA diferem apenas no tipo de encapsulamento.\n> PROM se comporta como tabela por endereços; PAL restringe o plano OR; PLA permite programar produtos e somas.\n\n===\n@id novo100-q052\n# cpld; fpga; arquitetura\n? Uma lógica pequena de decodificação de endereços precisa de atraso previsível e poucos registradores. Qual escolha é conceitualmente mais alinhada?\n- FPGA grande, porque sempre tem menor atraso que CPLD.\n* CPLD, por ser comum em glue logic com timing previsível.\n- DRAM, porque decodificação é memória.\n- Microprocessador, pois glue logic sempre executa programa.\n- ROM OTP, porque toda lógica deve ser gravada uma única vez.\n> CPLDs são muito usados para glue logic, decodificação e controle simples com timing previsível. FPGA é mais amplo e flexível para projetos maiores.\n\n===\n@id novo100-q053\n# hdl; síntese; bitstream\n? Qual sequência descreve melhor o fluxo para configurar uma FPGA?\n- Bitstream é escrito em Verilog e depois vira HDL.\n- HDL é executado instrução por instrução dentro da FPGA.\n* HDL descreve o hardware; síntese/mapeamento/roteamento geram bitstream; bitstream configura a FPGA.\n- Bitstream é o código-fonte editável do circuito.\n- Verilog só serve para simulação, nunca para síntese.\n> HDL é descrição de hardware. Ferramentas transformam essa descrição em configuração física: LUTs, FFs e roteamento, materializados no bitstream.\n\n===\n@id novo100-q054\n# assembly; label; branch\n? Considere:\n::codigo Trecho\nloop:\n  SUBS R0, R0, #1\n  BNE loop\n::fim\n? Se `R0` começa com 3 e `SUBS` atualiza a flag Z, quantas vezes `SUBS` executa?\n- 1\n- 2\n- 4\n* 3\n- Infinitas, porque label executa como instrução.\n> O label apenas marca endereço. `SUBS` executa com R0=3,2,1; após virar 0, Z=1 e `BNE` não desvia.\n\n===\n@id novo100-q055\n# assembly; bl; lr; retorno\n? Em uma arquitetura estilo ARM, o que acontece em `BL func` seguido de retorno com `BX LR` dentro da função?\n- `BL` desvia sem salvar nada; `BX LR` chama outra função.\n- `BL` salva o resultado da ULA em `LR`; `BX LR` zera o PC.\n- `BX LR` só funciona se `LR` for igual a zero.\n- `BL` é uma comparação condicional usando a flag B.\n* `BL` salva o endereço de retorno em `LR`; `BX LR` desvia para o endereço guardado em `LR`.\n> `BL` é branch with link: salva o retorno em LR. `BX LR` usa LR como alvo do desvio de retorno.\n\n===\n@id novo100-q056\n# assembly; endereçamento; load-store\n? Suponha `R1=0x2000`, memória `[0x2000]=9` e `R2=4`. Após `LDR R0, [R1]` seguido de `ADD R0, R0, R2`, o que mudou na memória?\n* Nada muda na memória; `R0` vira 13.\n- `[0x2000]` vira 13 automaticamente.\n- `[0x2004]` vira 13 automaticamente.\n- `[0x2000]` vira 4 porque ADD escreve na memória.\n- O endereço em `R1` vira 13.\n> `LDR` lê memória para registrador. `ADD` opera em registradores. Para alterar memória, seria necessário `STR`.\n\n===\n@id novo100-q057\n# assembly; pc-relative; offset\n? Um branch PC-relative usa offset em palavras de 4 bytes. Se o PC base usado no cálculo é `0x0800` e o offset imediato é `+6`, qual alvo?\n- `0x0806`\n* `0x0818`\n- `0x0812`\n- `0x0824`\n- `0x080C`\n> Offset em palavras deve ser multiplicado por 4. `6*4=24=0x18`; alvo `0x0800+0x18=0x0818`.\n\n===\n@id novo100-q058\n# assembly; modos de endereçamento; imediato\n? Qual alternativa distingue corretamente imediato, registrador e indireto por registrador?\n- `#8` lê a memória no endereço 8.\n- `[R3]` usa o valor literal 3 como dado.\n* `#8` é constante; `R3` é conteúdo do registrador; `[R3]` é memória apontada por R3.\n- `R3` e `[R3]` sempre significam a mesma coisa.\n- Imediato só pode aparecer em instrução de desvio.\n> A pegadinha é confundir dado, endereço e registrador. Colchetes indicam acesso à memória no endereço contido no registrador.\n\n===\n@id novo100-q059\n# datapath; etapas de instrução; load\n? Em uma instrução `LOAD R2, 8(R1)` em um datapath clássico de 5 etapas, qual sequência de uso é mais coerente?\n- Fetch busca dado da memória; Decode escreve R2; Execute atualiza PC.\n- Fetch lê R1; Execute escreve memória; Memory atualiza flags; Writeback não ocorre.\n- Decode acessa memória de dados diretamente; Memory é usado apenas em branches.\n* Fetch busca instrução; Decode lê R1; Execute calcula endereço; Memory lê dado; Writeback escreve R2.\n- Todas as etapas escrevem no banco de registradores.\n> Load busca instrução, lê registrador base, calcula endereço com ULA, lê memória de dados e escreve o registrador destino.\n\n===\n@id novo100-q060\n# controle; sinais; store\n? Para uma instrução `STORE R2, 12(R1)` em datapath simples, qual conjunto de sinais é mais plausível?\n- `RegWrite=1`, `MemRead=1`, `MemToReg=1`, `MemWrite=0`\n- `RegWrite=1`, `MemWrite=1`, `MemToReg=1`, `ALUSrc=0`\n- `Branch=1`, `MemWrite=0`, `ALUSrc=0`\n- `Jump=1`, `RegWrite=1`, ULA fazendo subtração\n* `RegWrite=0`, `MemWrite=1`, `ALUSrc=1`, ULA fazendo soma de base+offset\n> Store calcula endereço com base + offset, escreve memória e não escreve registrador destino. Por isso `ALUSrc=1`, `MemWrite=1`, `RegWrite=0`.\n\n===\n@id novo100-q061\n# controle; branch; zero\n? Em um datapath no qual `BEQ` usa a ULA para subtrair dois registradores, qual condição normalmente atualiza o PC para o alvo?\n* `Branch=1` e `Zero=1`.\n- `Branch=1`, independentemente da saída Zero.\n- `Zero=1`, independentemente de ser branch.\n- `MemToReg=1` e `Zero=0`.\n- `ALUSrc=1` e `RegWrite=1`.\n> `BEQ` desvia quando a comparação dá igualdade. A unidade de controle marca branch e a ULA sinaliza Zero após subtração.\n\n===\n@id novo100-q062\n# pipeline; hazard de dados; load-use\n? Em um pipeline clássico, a sequência abaixo gera qual problema principal?\n::codigo Trecho\nLW  R1, 0(R2)\nADD R3, R1, R4\n::fim\n- Hazard estrutural obrigatório na ULA.\n* Hazard load-use, pois o dado carregado ainda não está disponível para a instrução seguinte.\n- Hazard de controle, pois `ADD` altera o PC.\n- Hazard combinacional estático-1.\n- Nenhum, porque forwarding sempre resolve load-use sem stall.\n> O valor de `LW` normalmente só fica disponível após a etapa de memória. A instrução seguinte precisa dele na ULA cedo demais, podendo exigir stall mesmo com forwarding.\n\n===\n@id novo100-q063\n# pipeline; hazard de controle; branch\n? Uma instrução de branch condicional tem decisão conhecida apenas no final da etapa Execute. Qual efeito isso pode causar no pipeline?\n- Não afeta o fluxo, pois branch nunca altera PC.\n- Apenas hazard de memória, nunca de controle.\n* Instruções buscadas no caminho errado podem precisar ser descartadas.\n- O banco de registradores deixa de funcionar.\n- O clock precisa parar permanentemente.\n> Enquanto a decisão do branch não é conhecida, o processador pode buscar instruções do caminho sequencial. Se o branch for tomado, essas instruções são descartadas.\n\n===\n@id novo100-q064\n# controle; hardwired; microprogramado\n? Sobre unidade de controle hardwired e microprogramada, qual afirmação é correta?\n- Hardwired sempre usa uma ROM de microinstruções.\n- Microprogramada nunca usa memória de controle.\n- As duas movem dados diretamente no datapath.\n* Hardwired usa lógica de controle direta; microprogramada usa microinstruções armazenadas em controle.\n- Hardwired só existe em FPGA; microprogramada só em ASIC.\n> A unidade de controle gera sinais. Ela pode ser lógica combinacional/sequencial direta ou ler microinstruções de uma memória de controle.\n\n===\n@id novo100-q065\n# ativo baixo; sinais; leitura de tabela\n? Um chip tem sinais `CS_n`, `OE_n` e `WE_n`. Para uma leitura válida, qual combinação faz sentido?\n- `CS_n=1`, `OE_n=0`, `WE_n=1`\n- `CS_n=0`, `OE_n=1`, `WE_n=0`\n- `CS_n=1`, `OE_n=1`, `WE_n=0`\n- `CS_n=0`, `OE_n=0`, `WE_n=0`\n* `CS_n=0`, `OE_n=0`, `WE_n=1`\n> Sufixo `_n` indica ativo baixo. Para ler: chip selecionado (`CS_n=0`), saída habilitada (`OE_n=0`) e escrita desabilitada (`WE_n=1`).\n\n===\n@id novo100-q066\n# ascii; caractere; código\n? Em ASCII padrão, os códigos de `'0'` a `'9'` são consecutivos e `'0'` vale 48 decimal. Qual é o valor numérico do caractere `'7'` em ASCII?\n* 55\n- 7\n- 48\n- 0x07\n- 64\n> O caractere `'7'` não é o número 7. Como `'0'=48`, então `'7'=48+7=55`.\n\n===\n@id novo100-q067\n# checksum; limitação; erro compensado\n? Um checksum simples soma bytes módulo 256. Dois bytes de uma mensagem mudam de `20` para `21` e de `50` para `49`. O checksum:\n- Sempre detecta, pois qualquer alteração muda a soma.\n* Pode não detectar, pois a soma total foi preservada.\n- Corrige automaticamente o byte alterado.\n- Detecta apenas se houver paridade ímpar.\n- Vira CRC automaticamente por usar módulo.\n> Uma alteração aumenta 1 e a outra diminui 1. A soma módulo 256 pode ficar igual, mostrando limitação de checksum simples.\n\n===\n@id novo100-q068\n# excesso-3; complemento de 9; bcd\n? Em código excesso-3, o dígito decimal 6 é codificado como `1001`. Qual é o código excesso-3 do complemento de 9 desse dígito?\n- `0011`\n- `1001`\n* `0110`\n- `1100`\n- `0000`\n> Complemento de 9 de 6 é 3. Em excesso-3, soma-se 3 ao dígito decimal: `3+3=6`, código `0110`.\n\n===\n@id novo100-q069\n# binário; fração; conversão\n? O número binário `101.101₂` em decimal é:\n- `5,101`\n- `5,5`\n- `4,625`\n* `5,625`\n- `5,75`\n> Parte inteira `101₂=5`. Parte fracionária `.101₂ = 1/2 + 0/4 + 1/8 = 0,625`. Total `5,625`.\n\n===\n@id novo100-q070\n# complemento de 2; menor negativo; caso limite\n? Em 8 bits com complemento de 2, por que o valor `1000 0000` é um caso especial?\n- Ele representa `+128`, o maior positivo.\n- Ele tem dois valores possíveis, +0 e -0.\n- Ele é inválido em complemento de 2.\n- Ele sempre indica overflow, mesmo sem operação.\n* Ele representa `-128`, cujo positivo `+128` não cabe em 8 bits signed.\n> A faixa de 8 bits signed é de -128 a +127. O menor negativo não tem correspondente positivo representável.\n\n===\n@id novo100-q071\n# álgebra booleana; absorção; consenso\n? Simplifique `F=A + \\bar{A}B + AB`. Qual forma mínima é correta?\n* `A+B`\n- `A+B+AB`\n- `A\\bar{B}`\n- `A+\\bar{B}`\n- `AB`\n> `A+AB=A`. Então `F=A+\\bar{A}B`. Pela identidade `X+\\bar{X}Y=X+Y`, resulta `A+B`.\n\n===\n@id novo100-q072\n# dualidade; complemento; conceito\n? O dual de `A + 0 = A` é:\n- `\\bar{A}.1=\\bar{A}`\n* `A.1=A`\n- `A+1=1`\n- `\\bar{A}+0=\\bar{A}`\n- `A.0=0`\n> Dualidade troca `+` por `.` e `0` por `1`, sem complementar variáveis. Logo `A.1=A`.\n\n===\n@id novo100-q073\n# dont care; simplificação; obrigação\n? Em uma tabela verdade, algumas linhas estão marcadas como `X` por serem don't care. Qual uso é correto?\n- Todo `X` deve ser tratado como 1 em SOP.\n- Todo `X` deve ser tratado como 0 em POS.\n* Cada `X` pode ser escolhido como 0 ou 1 para simplificar, sem ser saída obrigatória.\n- `X` significa alta impedância elétrica.\n- `X` significa erro de transmissão detectado por paridade.\n> Don't care é liberdade de projeto para simplificação. Não é o mesmo que `Z` e não representa valor obrigatório.\n\n===\n@id novo100-q074\n# karnaugh; implicante essencial; cobertura\n? Em minimização por Karnaugh, um implicante essencial é aquele que:\n- Tem sempre o maior tamanho possível do mapa.\n- Contém somente don't cares.\n- Pode ser removido sem alterar a cobertura.\n* Cobre pelo menos um 1 que nenhum outro implicante cobre.\n- É qualquer grupo de dois.\n> Implicante essencial é necessário porque cobre algum mintermo obrigatório que não é coberto por outros grupos.\n\n===\n@id novo100-q075\n# mux; seleção; largura\n? Quantos seletores são necessários para um MUX 32:1, e quantos MUX 8:1 seriam necessários para montar o primeiro nível de uma implementação hierárquica simples de 32 entradas?\n- 32 seletores e 4 MUX 8:1\n- 5 seletores e 5 MUX 8:1\n- 8 seletores e 4 MUX 8:1\n- 4 seletores e 5 MUX 8:1\n* 5 seletores e 4 MUX 8:1\n> `2^5=32`, então são 5 seletores. No primeiro nível, 32 entradas podem ser divididas em 4 grupos de 8, usando 4 MUX 8:1.\n\n===\n@id novo100-q076\n# demux; roteamento; enable\n? Um DEMUX 1:4 recebe `D=1`, seletores `S1S0=10` e enable ativo alto em 1. Considerando saídas ativas altas, qual saída vale 1?\n* `Y2`\n- `Y0`\n- `Y1`\n- `Y3`\n- Todas, pois D=1.\n> DEMUX envia a entrada para uma única saída selecionada. `10₂=2`, então `Y2=1` e as demais 0.\n\n===\n@id novo100-q077\n# fsm; estado inalcançável; segurança\n? Uma FSM usa 3 FFs para 5 estados. O enunciado exige recuperação segura a partir de estados não usados. O que é incorreto fazer?\n- Definir transições dos estados não usados para o reset.\n* Tratar automaticamente todos os estados não usados como don't care sem verificar a exigência.\n- Levar estados inválidos para um estado seguro.\n- Considerar explicitamente `101`, `110`, `111`.\n- Usar lógica extra de detecção se necessário.\n> Se a prova exige recuperação segura, estados não usados não podem ser ignorados livremente como don't care.\n\n===\n@id novo100-q078\n# flip-flop t; excitação; síntese\n? Para implementar uma transição de um bit de estado com FF T, qual valor de `T` é necessário quando `Q=1` e `Q+=0`?\n- `0`, porque o bit deve manter.\n- `Q+`, portanto 0 sempre.\n* `1`, porque o bit precisa alternar.\n- `Q`, portanto 1 sempre por estar em 1.\n- Indefinido, pois FF T não permite transição 1 para 0.\n> FF T alterna quando `T=1` e mantém quando `T=0`. De 1 para 0 é alternância.\n\n===\n@id novo100-q079\n# flip-flop jk; excitação; tabela\n? Para uma transição `Q=0 -> Q+=1` usando FF JK, uma excitação válida é:\n- `J=0,K=0`\n- `J=0,K=1`\n- `J=X,K=1`\n* `J=1,K=X`\n- `J=1,K=1` é proibida em JK.\n> Para ir de 0 para 1, é preciso setar: `J=1`, e `K` é don't care porque reset não afeta quando Q atual é 0 nesse caso.\n\n===\n@id novo100-q080\n# contador assíncrono; ripple; atraso\n? Por que um contador ripple assíncrono tende a ser pior para alta velocidade que um contador síncrono?\n- Porque usa mais FFs para o mesmo módulo.\n- Porque não consegue contar em binário.\n- Porque todos os FFs recebem o mesmo clock.\n- Porque não pode ter reset.\n* Porque as mudanças se propagam de FF para FF, acumulando atraso.\n> No contador assíncrono, a saída de um FF aciona o próximo. Isso gera ripple delay acumulado.\n\n===\n@id novo100-q081\n# temporização; setup e hold; correção\n? Um projeto viola hold, mas atende setup com folga. Qual ação ataca diretamente o problema de hold?\n* Inserir atraso mínimo no caminho de dados curto ou ajustar skew para atrasar a chegada do dado.\n- Reduzir a frequência de clock.\n- Aumentar o período de clock.\n- Remover buffers do caminho curto.\n- Aumentar apenas o atraso máximo do caminho crítico.\n> Hold depende do dado chegar cedo demais após a borda. Reduzir frequência ajuda setup, mas normalmente não resolve hold.\n\n===\n@id novo100-q082\n# caminho crítico; múltiplos caminhos; fmax\n? Um circuito síncrono tem três caminhos registrador-para-registrador com atrasos máximos totais já incluindo `tCQ` e `tsetup`: 8 ns, 11 ns e 9 ns. Qual é a Fmax ideal aproximada?\n- `125 MHz`\n* `90,9 MHz`\n- `111,1 MHz`\n- `333 MHz`\n- `11 MHz`\n> O caminho crítico é o maior: 11 ns. `Fmax≈1/11ns≈90,9 MHz`.\n\n===\n@id novo100-q083\n# física; tensão; corrente; potência\n? Um bloco consome `12 mA` em `1,2 V` durante operação. A potência média é:\n- `10 mW`\n- `1,44 mW`\n* `14,4 mW`\n- `14,4 W`\n- `0,1 mW`\n> `P=V.I = 1,2 * 0,012 = 0,0144 W = 14,4 mW`.\n\n===\n@id novo100-q084\n# capacitor; energia; potência\n? Um capacitor efetivo de `10 pF` é carregado de 0 a `1 V`. A energia armazenada no capacitor é:\n- `10 pJ`\n- `5 nJ`\n- `1 pJ`\n* `5 pJ`\n- `50 pJ`\n> Energia armazenada: `E=1/2 C V² = 0,5*10pF*1² = 5pJ`.\n\n===\n@id novo100-q085\n# cmos; nand; rede transistor\n? Para uma porta NAND CMOS de duas entradas, qual descrição das redes é correta?\n- NMOS em paralelo e PMOS em série.\n- NMOS em série e PMOS em série.\n- NMOS em paralelo e PMOS em paralelo.\n- Apenas PMOS, pois NAND é pull-up.\n* NMOS em série e PMOS em paralelo.\n> NAND só puxa a saída para 0 quando A e B são 1, por isso NMOS em série. O pull-up dual usa PMOS em paralelo.\n\n===\n@id novo100-q086\n# cmos; nor; rede transistor\n? Para uma porta NOR CMOS de duas entradas, qual descrição está correta?\n* NMOS em paralelo e PMOS em série.\n- NMOS em série e PMOS em paralelo.\n- NMOS em série e PMOS em série.\n- NMOS em paralelo e PMOS em paralelo.\n- Apenas NMOS, pois NOR não precisa pull-up.\n> NOR deve puxar para 0 se qualquer entrada for 1, então NMOS em paralelo. O pull-up dual fica com PMOS em série.\n\n===\n@id novo100-q087\n# memória; banco de registradores; portas\n? Um banco de registradores precisa ler dois operandos e escrever um resultado no mesmo ciclo. Qual organização de portas é típica?\n- 1 porta de leitura e 1 de escrita.\n* 2 portas de leitura e 1 porta de escrita.\n- 3 portas de escrita e nenhuma leitura.\n- 1 porta compartilhada para tudo, sem conflito possível.\n- Apenas memória ROM.\n> Datapaths de ULA frequentemente precisam ler dois registradores fonte e escrever um destino, exigindo duas leituras e uma escrita.\n\n===\n@id novo100-q088\n# datapath; regwrite; instrução tipo r\n? Para uma instrução tipo R `ADD R3,R1,R2`, qual caminho de writeback é esperado?\n- Dado da memória para R3 com `MemToReg=1`.\n- Imediato para memória com `MemWrite=1`.\n* Resultado da ULA para R3 com `RegWrite=1` e `MemToReg=0`.\n- Nenhum writeback, pois ADD só altera flags.\n- PC para R3 obrigatoriamente.\n> ADD tipo R usa registradores como operandos, ULA para somar e escreve o resultado no registrador destino.\n\n===\n@id novo100-q089\n# datapath; jump; branch; pc\n? Qual diferença conceitual entre `Jump` e `Branch` condicional em um datapath simples?\n- Jump depende sempre da flag Zero; Branch nunca depende.\n- Branch salva retorno; Jump nunca altera PC.\n- Jump escreve memória; Branch escreve registrador.\n* Jump altera PC sem depender de comparação; Branch condicional altera PC apenas se a condição for satisfeita.\n- Não há diferença; ambos são labels.\n> Jump é desvio incondicional. Branch condicional combina sinal de controle com condição/flag.\n\n===\n@id novo100-q090\n# instruções; formatos; tipo r i j\n? Uma instrução que soma um registrador com um imediato e guarda em registrador destino é mais naturalmente classificada como:\n- Tipo R, pois toda soma é R.\n- Tipo J, pois imediato é endereço de salto.\n- Tipo 0 endereço, pois usa pilha.\n- Tipo memória, pois imediato sempre acessa RAM.\n* Tipo I, pois contém operando imediato.\n> Tipo I normalmente inclui imediato, offset ou constante embutida na instrução.\n\n===\n@id novo100-q091\n# pilha; arquitetura; operandos implícitos\n? Em uma arquitetura de 0 endereços baseada em pilha, a instrução `ADD` normalmente:\n* Desempilha dois operandos do topo e empilha o resultado.\n- Soma dois registradores explícitos indicados na instrução.\n- Usa sempre o endereço absoluto 0.\n- Soma o PC com LR.\n- Escreve diretamente na ROM.\n> Em máquina de pilha, operandos ficam implícitos no topo da pilha; por isso a instrução pode não nomear registradores.\n\n===\n@id novo100-q092\n# endereçamento; sign extension; branch negativo\n? Um branch usa imediato signed de 6 bits em palavras. O imediato é `111100`. Qual deslocamento em bytes?\n- `+60 bytes`\n* `-16 bytes`\n- `+48 bytes`\n- `-4 bytes`\n- `-12 bytes`\n> `111100` em 6 bits complemento de 2 vale -4. Como o offset está em palavras de 4 bytes, deslocamento em bytes é `-4*4=-16`.\n\n===\n@id novo100-q093\n# barramento; tri-state; enable\n? Quatro módulos podem dirigir um mesmo barramento tri-state. Qual condição é segura?\n- Todos habilitados ao mesmo tempo, se os dados forem parecidos.\n- Nenhum pode ficar em `Z`.\n* No máximo um driver habilitado por vez; os demais em alta impedância.\n- Drivers com 0 vencem drivers com 1.\n- O barramento escolhe automaticamente o maior valor.\n> Barramento tri-state exige controle para evitar contenção. Só um driver deve dirigir o barramento por vez.\n\n===\n@id novo100-q094\n# lut; mux interno; implementação\n? Uma maneira conceitual de entender uma LUT de 3 entradas é:\n- Uma ULA de 3 bits que executa instruções.\n- Uma RAM de 3 bits totais.\n- Um conjunto fixo de portas que nunca muda.\n* Uma pequena tabela de 8 bits selecionada pelas 3 entradas.\n- Um flip-flop com 3 clocks.\n> 3 entradas geram 8 combinações. A LUT armazena um bit de saída para cada combinação, selecionado pelas entradas.\n\n===\n@id novo100-q095\n# cpld; macrocell; registrador opcional\n? Em CPLDs, uma macrocell costuma combinar:\n- Apenas DRAM e cache.\n- Núcleos de CPU completos obrigatórios.\n- Somente uma LUT de 6 entradas sem roteamento.\n- Memória flash de armazenamento de arquivos.\n* Lógica combinacional programável com opção de registrar a saída.\n> Macrocélulas normalmente têm rede lógica tipo soma de produtos e podem incluir flip-flop/controle de saída, dependendo do CPLD.\n\n===\n@id novo100-q096\n# karnaugh; hazard; expressão mínima\n? Por que uma expressão SOP mínima pode não ser a melhor escolha quando a questão pede saída livre de hazard estático-1?\n* Porque remover termo redundante pode criar lacuna temporal entre grupos adjacentes.\n- Porque expressão mínima sempre usa POS.\n- Porque hazard só ocorre em circuitos sequenciais.\n- Porque Karnaugh não permite sobreposição.\n- Porque don't care deve virar sempre 0.\n> Termos redundantes podem ser logicamente desnecessários, mas fisicamente úteis para cobrir transições e evitar glitch.\n\n===\n@id novo100-q097\n# memória; eeprom; flash; prom\n? Qual afirmação sobre PROM, EPROM, EEPROM e Flash é correta no sentido clássico?\n- PROM é apagável eletricamente várias vezes.\n* PROM é programável uma vez; EPROM apaga por UV; EEPROM apaga eletricamente; Flash é uma forma de EEPROM em blocos.\n- EPROM perde dados ao desligar como SRAM.\n- Flash só pode ser lida, nunca apagada.\n- EEPROM e DRAM são a mesma tecnologia.\n> A distinção clássica é sobre forma de programação/apagamento e não volatilidade.\n\n===\n@id novo100-q098\n# reset; síncrono; assíncrono\n? Um flip-flop tem reset assíncrono ativo baixo `RST_n`. Se `RST_n` vai a 0 entre bordas de clock, o que deve ocorrer?\n- Nada até a próxima borda, pois todo reset depende do clock.\n- O estado alterna como FF T.\n* O flip-flop é resetado independentemente da borda de clock.\n- A saída fica em `Z`.\n- O reset só ocorre se D também for 0.\n> Reset assíncrono atua fora da borda de clock. O sufixo `_n` indica que o reset é ativo em 0.\n\n===\n@id novo100-q099\n# ula; comparação; flags signed\n? Após calcular `A-B`, uma comparação signed `A<B` em complemento de 2 costuma usar quais flags?\n- Apenas `C=0`.\n- Apenas `Z=1`.\n- Apenas `MemWrite=1`.\n* Relação entre `N` e `V`, tipicamente `N xor V`.\n- Apenas `C=1`, igual à comparação unsigned.\n> Para signed, overflow pode tornar o bit de sinal do resultado enganoso. Por isso usa-se combinação como `N xor V`; unsigned costuma usar carry/borrow.\n\n===\n@id novo100-q100\n# integração; assembly; memória; flags\n? Considere os registradores iniciais `R0=0`, `R1=3`, `R2=0x2000` e memória inicialmente zerada.\n::codigo Trecho\nloop:\n  ADD  R0, R0, R1\n  SUBS R1, R1, #1\n  BNE  loop\n  STR  R0, [R2]\n::fim\n? Ao final, qual valor é escrito em `[0x2000]`?\n- `3`\n- `4`\n- `5`\n- Nada é escrito, pois `BNE` sempre desvia.\n* `6`\n> O laço soma `3`, depois `2`, depois `1`. Quando `R1` vira 0, Z=1 e `BNE` não desvia. Então `STR` grava `R0=6` na memória.\n"};
"use strict";

const STORAGE_KEY = "questoes_pontos_fracos_v1";
const BANK_KEY = "questoes_banco_unico_v2";
const BUILT_IN_BANKS = [];

const state = {
  questions: [],
  currentQuestion: null,
  queue: [],
  answered: false,
  selectedOptionIndex: null,
  weakOnly: false,
  progress: loadProgress()
};

const els = {
  configButton: document.getElementById("configButton"),
  questionCard: document.getElementById("questionCard")
};

function loadProgress() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
  } catch {
    return {};
  }
}

function saveProgress() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state.progress));
}

function saveBank(text) {
  localStorage.setItem(BANK_KEY, text);
}

function loadSavedBank() {
  return localStorage.getItem(BANK_KEY) || "";
}

function escapeHtml(text) {
  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function renderInline(text) {
  return escapeHtml(text)
    .replace(/\\overline\{([^}]+)\}/g, '<span class="overline">$1</span>')
    .replace(/\\bar\{([^}]+)\}/g, '<span class="overline">$1</span>')
    .replace(/`([^`]+)`/g, "<code>$1</code>");
}

function splitCells(line) {
  return line.split(";").map((cell) => cell.trim());
}

function pushText(question, field, value) {
  const text = value.trim();
  if (text) question[field].push(text);
}

function parseQuestions(text) {
  const blocks = text
    .replace(/\r\n/g, "\n")
    .split(/^===\s*$/m)
    .map((block) => block.trim())
    .filter(Boolean);

  const questions = [];

  for (const block of blocks) {
    const question = {
      id: "",
      prompt: [],
      options: [],
      explanation: [],
      categories: [],
      artifacts: []
    };
    let currentArtifact = null;

    for (const rawLine of block.split("\n")) {
      const line = rawLine.trimEnd();
      const trimmed = line.trim();
      if (!trimmed || trimmed.startsWith("//")) continue;

      if (trimmed.startsWith("::tabela")) {
        currentArtifact = { type: "table", caption: trimmed.replace("::tabela", "").trim(), rows: [] };
        question.artifacts.push(currentArtifact);
        continue;
      }

      if (trimmed.startsWith("::codigo")) {
        currentArtifact = { type: "code", caption: trimmed.replace("::codigo", "").trim(), lines: [] };
        question.artifacts.push(currentArtifact);
        continue;
      }

      if (trimmed === "::fim") {
        currentArtifact = null;
        continue;
      }

      if (currentArtifact?.type === "table" && trimmed.startsWith("|")) {
        currentArtifact.rows.push(splitCells(trimmed.slice(1)));
        continue;
      }

      if (currentArtifact?.type === "code") {
        currentArtifact.lines.push(line);
        continue;
      }

      if (trimmed.startsWith("@id")) {
        question.id = trimmed.replace("@id", "").trim();
      } else if (trimmed.startsWith("#")) {
        question.categories.push(...trimmed.slice(1).split(";").map((cat) => cat.trim()).filter(Boolean));
      } else if (trimmed.startsWith("?")) {
        pushText(question, "prompt", trimmed.slice(1));
      } else if (trimmed.startsWith("*")) {
        question.options.push({ text: trimmed.slice(1).trim(), correct: true });
      } else if (trimmed.startsWith("-")) {
        question.options.push({ text: trimmed.slice(1).trim(), correct: false });
      } else if (trimmed.startsWith(">")) {
        pushText(question, "explanation", trimmed.slice(1));
      } else {
        pushText(question, "prompt", trimmed);
      }
    }

    if (!question.id) question.id = "q-" + (questions.length + 1);
    if (!question.categories.length) question.categories.push("sem categoria");

    const correctCount = question.options.filter((option) => option.correct).length;
    if (question.prompt.length && question.options.length >= 2 && correctCount === 1) {
      questions.push(question);
    }
  }

  return questions;
}

function getQuestionStats(question) {
  return state.progress[question.id] || {
    correct: 0,
    wrong: 0,
    unknown: 0,
    note: "",
    last: null
  };
}

function setQuestionStats(question, patch) {
  state.progress[question.id] = {
    ...getQuestionStats(question),
    ...patch,
    last: new Date().toISOString()
  };
  saveProgress();
}

function scoreQuestion(question) {
  const stats = getQuestionStats(question);
  return (stats.wrong || 0) * 3 + (stats.unknown || 0) * 4 - (stats.correct || 0);
}

function shuffle(list) {
  const copy = [...list];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function candidateQuestions() {
  if (!state.weakOnly) return state.questions;
  const weak = state.questions.filter((question) => scoreQuestion(question) > 0);
  return weak.length ? weak : state.questions;
}

function rebuildQueue() {
  const candidates = candidateQuestions();
  state.queue = shuffle(candidates.map((question) => question.id));
}

function pickNextQuestion() {
  if (!state.questions.length) {
    state.currentQuestion = null;
    return;
  }

  if (!state.queue.length) rebuildQueue();
  const nextId = state.queue.shift();
  state.currentQuestion = state.questions.find((question) => question.id === nextId) || state.questions[0];
  state.answered = false;
  state.selectedOptionIndex = null;
}

function renderArtifact(artifact) {
  if (artifact.type === "code") {
    return `
      <figure class="artifact-code">
        ${artifact.caption ? `<figcaption>${renderInline(artifact.caption)}</figcaption>` : ""}
        <pre>${artifact.lines.map(escapeHtml).join("\n")}</pre>
      </figure>
    `;
  }

  if (artifact.type === "table") {
    const [header, ...rows] = artifact.rows;
    return `
      <table class="artifact-table">
        ${artifact.caption ? `<caption>${renderInline(artifact.caption)}</caption>` : ""}
        ${header ? `<thead><tr>${header.map((cell) => `<th>${renderInline(cell)}</th>`).join("")}</tr></thead>` : ""}
        <tbody>
          ${rows.map((row) => `<tr>${row.map((cell) => `<td>${renderInline(cell)}</td>`).join("")}</tr>`).join("")}
        </tbody>
      </table>
    `;
  }

  return "";
}

function renderQuestion() {
  const question = state.currentQuestion;

  if (!question) {
    els.questionCard.innerHTML = `
      <div class="empty-state">
        <h2>Nenhuma questão carregada</h2>
        <p>Abra Config e importe um arquivo `.txt`.</p>
      </div>
    `;
    return;
  }

  els.questionCard.innerHTML = `
    <div class="question-text">
      ${question.prompt.map((line) => `<p>${renderInline(line)}</p>`).join("")}
    </div>
    ${question.artifacts.map(renderArtifact).join("")}
    <div class="options">
      ${question.options.map((option, index) => `
        <button class="option" type="button" data-option-index="${index}">
          <span class="letter">${String.fromCharCode(65 + index)}</span>
          <span>${renderInline(option.text)}</span>
        </button>
      `).join("")}
    </div>
    <div class="actions">
      <button id="answerButton" type="button">Responder</button>
      <button id="unknownButton" type="button" class="ghost">Não sei</button>
      <button id="nextButton" type="button" hidden>Próxima</button>
    </div>
    <div id="feedback" class="feedback" hidden></div>
  `;

  for (const button of els.questionCard.querySelectorAll("[data-option-index]")) {
    button.addEventListener("click", () => selectOption(Number(button.dataset.optionIndex)));
  }

  document.getElementById("answerButton").addEventListener("click", answerSelectedQuestion);
  document.getElementById("unknownButton").addEventListener("click", markUnknown);
  document.getElementById("nextButton").addEventListener("click", () => {
    pickNextQuestion();
    renderQuestion();
  });
}

function selectOption(optionIndex) {
  if (state.answered) return;
  state.selectedOptionIndex = optionIndex;
  for (const button of els.questionCard.querySelectorAll("[data-option-index]")) {
    button.classList.toggle("selected", Number(button.dataset.optionIndex) === optionIndex);
  }
}

function revealPostAnswer() {
  const answerButton = document.getElementById("answerButton");
  const unknownButton = document.getElementById("unknownButton");
  const nextButton = document.getElementById("nextButton");
  if (answerButton) answerButton.hidden = true;
  if (unknownButton) unknownButton.hidden = true;
  if (nextButton) nextButton.hidden = false;
}

function showFeedback(title) {
  const question = state.currentQuestion;
  const stats = getQuestionStats(question);
  const feedback = document.getElementById("feedback");
  feedback.hidden = false;
  feedback.innerHTML = `
    <h3>${title}</h3>
    <div class="question-meta revealed-meta">
      ${question.categories.map((cat) => `<span class="tag">${renderInline(cat)}</span>`).join("")}
      <span class="tag">Acertos ${stats.correct || 0}</span>
      <span class="tag">Erros ${stats.wrong || 0}</span>
      <span class="tag">Não sei ${stats.unknown || 0}</span>
    </div>
    ${question.explanation.length ? question.explanation.map((line) => `<p>${renderInline(line)}</p>`).join("") : "<p>Sem explicação cadastrada.</p>"}
    <label class="note-field">
      OBS desta questão
      <textarea id="questionNote" rows="3" placeholder="Anote sua dúvida, raciocínio, fórmula que esqueceu ou pegadinha percebida...">${escapeHtml(stats.note || "")}</textarea>
    </label>
  `;
  document.getElementById("questionNote").addEventListener("input", (event) => {
    setQuestionStats(question, { note: event.target.value });
  });
}

function answerSelectedQuestion() {
  const question = state.currentQuestion;
  if (state.selectedOptionIndex === null) {
    alert("Selecione uma alternativa antes de responder.");
    return;
  }

  state.answered = true;
  const option = question.options[state.selectedOptionIndex];
  const stats = getQuestionStats(question);

  for (const [index, button] of [...els.questionCard.querySelectorAll("[data-option-index]")].entries()) {
    if (question.options[index].correct) button.classList.add("correct");
    if (index === state.selectedOptionIndex && !option.correct) button.classList.add("wrong");
  }

  if (option.correct) {
    setQuestionStats(question, { correct: (stats.correct || 0) + 1 });
    showFeedback("Correta");
  } else {
    setQuestionStats(question, { wrong: (stats.wrong || 0) + 1 });
    showFeedback("Incorreta");
  }
  revealPostAnswer();
}

function markUnknown() {
  const question = state.currentQuestion;
  if (state.answered) return;
  state.answered = true;
  const stats = getQuestionStats(question);
  setQuestionStats(question, { unknown: (stats.unknown || 0) + 1 });

  for (const [index, button] of [...els.questionCard.querySelectorAll("[data-option-index]")].entries()) {
    if (question.options[index].correct) button.classList.add("correct");
  }

  showFeedback("Marcada como não sei");
  revealPostAnswer();
}

function totalStats() {
  return state.questions.reduce((acc, question) => {
    const stats = getQuestionStats(question);
    acc.correct += stats.correct || 0;
    acc.wrong += stats.wrong || 0;
    acc.unknown += stats.unknown || 0;
    return acc;
  }, { correct: 0, wrong: 0, unknown: 0 });
}

function topicStats() {
  const topicMap = new Map();
  for (const question of state.questions) {
    const stats = getQuestionStats(question);
    for (const cat of question.categories) {
      const current = topicMap.get(cat) || { wrong: 0, unknown: 0, correct: 0, questions: 0 };
      current.wrong += stats.wrong || 0;
      current.unknown += stats.unknown || 0;
      current.correct += stats.correct || 0;
      current.questions += 1;
      topicMap.set(cat, current);
    }
  }

  return [...topicMap.entries()]
    .map(([name, stats]) => ({
      name,
      ...stats,
      losses: stats.wrong + stats.unknown,
      score: stats.wrong * 3 + stats.unknown * 4 - stats.correct
    }))
    .sort((a, b) => b.score - a.score || b.losses - a.losses || a.name.localeCompare(b.name));
}

function observationRows() {
  return state.questions
    .map((question) => ({ question, stats: getQuestionStats(question) }))
    .filter((item) => (item.stats.note || "").trim())
    .sort((a, b) => Date.parse(b.stats.last || 0) - Date.parse(a.stats.last || 0));
}

function plainQuestionText(question) {
  return question.prompt.join(" ").replace(/\s+/g, " ").trim();
}

function renderConfigView() {
  const totals = totalStats();
  const topics = topicStats();
  const notes = observationRows();

  els.questionCard.innerHTML = `
    <div class="config-view">
      <div class="view-heading">
        <h2>Config</h2>
        <button id="backToTrainingButton" type="button">Voltar para questões</button>
      </div>

      <div class="metric-row">
        <div><span>Questões</span><strong>${state.questions.length}</strong></div>
        <div><span>Acertos</span><strong>${totals.correct}</strong></div>
        <div><span>Erros / Não sei</span><strong>${totals.wrong + totals.unknown}</strong></div>
      </div>

      <div class="config-actions">
        <label class="import-button inline-import">
          Importar novas questões
          <input id="fileInput" type="file" accept=".txt,text/plain">
        </label>
        <button id="weakToggleButton" type="button" class="${state.weakOnly ? "" : "ghost"}">${state.weakOnly ? "Modo pontos fracos ligado" : "Modo aleatório geral"}</button>
        <button id="exportIaButton" type="button" class="ghost">Exportar IA</button>
      </div>

      <section class="config-section">
        <h3>Prioridade por tema</h3>
        <div class="weak-list">
          ${topics.slice(0, 12).map((topic) => `
            <div class="topic-pill">
              <strong>${renderInline(topic.name)}</strong>
              <span>${topic.wrong + topic.unknown} perdas / ${topic.correct} acertos</span>
            </div>
          `).join("") || '<p class="topic-pill">Sem dados ainda.</p>'}
        </div>
      </section>

      <section class="config-section">
        <h3>OBS salvas</h3>
        <div class="observation-list">
          ${notes.length ? notes.map(({ question, stats }) => `
            <article class="observation-item">
              <div class="question-meta">
                ${question.categories.map((cat) => `<span class="tag">${renderInline(cat)}</span>`).join("")}
                <span class="tag">Erros ${stats.wrong || 0}</span>
                <span class="tag">Não sei ${stats.unknown || 0}</span>
              </div>
              <p class="observation-prompt">${renderInline(plainQuestionText(question))}</p>
              <div class="observation-note">${renderInline(stats.note || "")}</div>
            </article>
          `).join("") : '<p class="topic-pill">Nenhuma OBS salva ainda.</p>'}
        </div>
      </section>
    </div>
  `;

  document.getElementById("backToTrainingButton").addEventListener("click", renderQuestion);
  document.getElementById("weakToggleButton").addEventListener("click", () => {
    state.weakOnly = !state.weakOnly;
    rebuildQueue();
    pickNextQuestion();
    renderConfigView();
  });
  document.getElementById("exportIaButton").addEventListener("click", exportForIa);
  document.getElementById("fileInput").addEventListener("change", importQuestionsFile);
}

function questionDifficultyRows() {
  return state.questions
    .map((question) => ({ question, stats: getQuestionStats(question), score: scoreQuestion(question) }))
    .filter((item) => item.score > 0 || (item.stats.note || "").trim())
    .sort((a, b) => b.score - a.score);
}

function buildIaExport() {
  const totals = totalStats();
  const topics = topicStats();
  const weakQuestions = questionDifficultyRows();
  const notes = observationRows();

  const topicLines = topics
    .filter((topic) => topic.losses > 0 || topic.score > 0)
    .map((topic, index) => `${index + 1}. ${topic.name}: score=${topic.score}; erros=${topic.wrong}; nao_sei=${topic.unknown}; acertos=${topic.correct}; questoes_no_tema=${topic.questions}`)
    .join("\n") || "Nenhum ponto fraco registrado ainda.";

  const noteLines = notes
    .map((item, index) => [
      `${index + 1}. id=${item.question.id}`,
      `categorias=${item.question.categories.join("; ")}`,
      `enunciado=${plainQuestionText(item.question)}`,
      `obs=${(item.stats.note || "").trim()}`
    ].join("\n   "))
    .join("\n\n") || "Nenhuma OBS registrada.";

  const questionLines = weakQuestions
    .slice(0, 80)
    .map((item, index) => [
      `${index + 1}. id=${item.question.id}`,
      `categorias=${item.question.categories.join("; ")}`,
      `score=${item.score}; erros=${item.stats.wrong || 0}; nao_sei=${item.stats.unknown || 0}; acertos=${item.stats.correct || 0}`,
      `enunciado=${plainQuestionText(item.question)}`,
      `obs_do_aluno=${(item.stats.note || "").trim() || "sem obs"}`,
      `explicacao_base=${item.question.explanation.join(" ").replace(/\s+/g, " ").trim()}`
    ].join("\n   "))
    .join("\n\n") || "Nenhuma questao errada, marcada como nao sei ou com OBS.";

  return [
    "Quero que voce analise meus pontos fracos em Sistemas Digitais a partir dos dados abaixo.",
    "",
    "CONTEXTO",
    "- Estou treinando para prova objetiva de Sistemas Digitais.",
    "- Trate 'nao sei' como prioridade maior que erro comum.",
    "- Analise minhas OBS como pistas do meu raciocinio.",
    "- Nao crie assuntos fora do escopo de Sistemas Digitais.",
    "",
    "O QUE EU QUERO COMO RESPOSTA",
    "1. Diagnostico dos 5 maiores pontos fracos.",
    "2. Revisao guiada por tema fraco, com conceito, formulas, unidades, gatilhos de prova e pegadinhas.",
    "3. Correcao explicita das confusoes que aparecerem nas OBS.",
    "4. Plano de revisao de 2 a 3 dias.",
    "5. Dez questoes novas dificeis e traiçoeiras, com gabarito e explicacao.",
    "",
    "RESUMO GERAL",
    `- Questoes carregadas: ${state.questions.length}`,
    `- Acertos: ${totals.correct}`,
    `- Erros: ${totals.wrong}`,
    `- Nao sei: ${totals.unknown}`,
    `- Exportado em: ${new Date().toLocaleString("pt-BR")}`,
    "",
    "PRIORIDADE POR TEMA",
    topicLines,
    "",
    "OBS REGISTRADAS",
    noteLines,
    "",
    "QUESTOES COM DIFICULDADE",
    questionLines
  ].join("\n");
}

async function copyText(text) {
  if (navigator.clipboard?.writeText && window.isSecureContext) {
    await navigator.clipboard.writeText(text);
    return true;
  }

  const textArea = document.createElement("textarea");
  textArea.value = text;
  textArea.setAttribute("readonly", "");
  textArea.style.position = "fixed";
  textArea.style.top = "-1000px";
  document.body.appendChild(textArea);
  textArea.select();
  const copied = document.execCommand("copy");
  document.body.removeChild(textArea);
  return copied;
}

function showManualExport(text) {
  els.questionCard.innerHTML = `
    <div class="export-panel">
      <h2>Relatório para IA</h2>
      <p>A cópia automática não funcionou neste navegador. Selecione o texto abaixo e copie manualmente.</p>
      <textarea id="iaExportText" class="export-textarea" readonly></textarea>
      <div class="actions">
        <button id="selectIaExportButton" type="button">Selecionar texto</button>
        <button id="backToConfigButton" type="button" class="ghost">Voltar</button>
      </div>
    </div>
  `;
  const textArea = document.getElementById("iaExportText");
  textArea.value = text;
  document.getElementById("selectIaExportButton").addEventListener("click", () => {
    textArea.focus();
    textArea.select();
  });
  document.getElementById("backToConfigButton").addEventListener("click", renderConfigView);
  textArea.focus();
  textArea.select();
}

async function exportForIa() {
  if (!state.questions.length) {
    alert("Carregue questões antes de exportar.");
    return;
  }

  const text = buildIaExport();
  try {
    const copied = await copyText(text);
    if (copied) alert("Relatório para IA copiado. Agora cole no chat.");
    else showManualExport(text);
  } catch {
    showManualExport(text);
  }
}

function readTextFile(file) {
  if (typeof file.text === "function") return file.text();

  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result || ""));
    reader.onerror = () => reject(reader.error);
    reader.readAsText(file, "UTF-8");
  });
}

function mergeQuestionTexts(existingText, newText) {
  return [existingText.trim(), newText.trim()].filter(Boolean).join("\n\n");
}

function loadQuestionsFromText(text, { append = false } = {}) {
  const parsed = parseQuestions(text);
  if (!parsed.length) {
    alert("Nenhuma questão válida encontrada.");
    return;
  }

  if (append) {
    const byId = new Map(state.questions.map((question) => [question.id, question]));
    for (const question of parsed) byId.set(question.id, question);
    state.questions = [...byId.values()];
    const merged = mergeQuestionTexts(loadSavedBank(), text);
    saveBank(merged);
  } else {
    state.questions = parsed;
    saveBank(text);
  }

  rebuildQueue();
  pickNextQuestion();
  renderQuestion();
}

async function importQuestionsFile(event) {
  const file = event.target.files?.[0];
  if (!file) return;
  try {
    const text = await readTextFile(file);
    loadQuestionsFromText(text, { append: true });
    alert("Questões importadas para o banco único.");
  } catch {
    alert("Não consegui ler esse TXT neste navegador.");
  }
}

async function loadBuiltInBank() {
  if (window.EMBEDDED_BANKS?.combined) {
    loadQuestionsFromText(window.EMBEDDED_BANKS.combined);
    return;
  }

  const saved = loadSavedBank();
  if (saved) {
    loadQuestionsFromText(saved);
    return;
  }

  try {
    const texts = await Promise.all(BUILT_IN_BANKS.map(async (path) => {
      const response = await fetch(path);
      return response.text();
    }));
    loadQuestionsFromText(texts.join("\n\n"));
  } catch {
    els.questionCard.innerHTML = `
      <div class="empty-state">
        <h2>Não consegui carregar o banco</h2>
        <p>Abra Config e importe um arquivo `.txt`, ou use a versão tablet/offline.</p>
      </div>
    `;
  }
}

els.configButton.addEventListener("click", renderConfigView);



loadBuiltInBank();

</script>
