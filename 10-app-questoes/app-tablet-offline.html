<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quest?es - Tablet Offline</title>
  <style>
:root {
  --bg: #f4f6f5;
  --surface: #ffffff;
  --surface-alt: #eef3f1;
  --ink: #182421;
  --muted: #60706b;
  --line: #d8e1de;
  --primary: #006a63;
  --primary-dark: #004f4a;
  --good: #126b43;
  --bad: #ae3029;
  --warn: #8a5b00;
  --shadow: 0 8px 26px rgba(22, 44, 39, 0.08);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  color: var(--ink);
  background: var(--bg);
  font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

button, select {
  font: inherit;
}

button {
  min-height: 42px;
  border: 0;
  border-radius: 8px;
  color: #fff;
  background: var(--primary);
  font-weight: 700;
  cursor: pointer;
}

button:hover { background: var(--primary-dark); }
button.ghost {
  color: var(--primary-dark);
  border: 1px solid var(--line);
  background: #fff;
}

.topbar {
  display: flex;
  gap: 16px;
  align-items: center;
  justify-content: space-between;
  padding: 18px clamp(16px, 4vw, 34px);
  color: #fff;
  background: #005d57;
}

.topbar-button {
  min-width: 96px;
  color: var(--primary-dark);
  background: #fff;
}

.topbar-button:hover {
  color: #fff;
  background: var(--primary-dark);
}

.topbar h1 {
  margin: 0;
  font-size: 1.55rem;
}

.topbar p {
  margin: 2px 0 0;
  color: #d1e8e5;
}

.import-button {
  position: relative;
  display: inline-flex;
  align-items: center;
  min-height: 42px;
  padding: 0 14px;
  border-radius: 8px;
  color: var(--primary-dark);
  background: #fff;
  font-weight: 800;
  cursor: pointer;
}

.import-button input {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
}

.app-shell {
  width: min(1180px, calc(100% - 24px));
  margin: 18px auto 40px;
}

.panel, .question-card {
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
  box-shadow: var(--shadow);
}

.metric-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.metric-row div {
  padding: 10px;
  border-radius: 8px;
  background: var(--surface-alt);
}

.metric-row span {
  display: block;
  color: var(--muted);
  font-size: 0.78rem;
}

.metric-row strong {
  font-size: 1.35rem;
}

.button-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin: 14px 0;
}

.config-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 14px 0;
}

.config-actions > * {
  flex: 1 1 190px;
}

.inline-import {
  justify-content: center;
}

.config-section {
  margin-top: 22px;
}

.config-section h3 {
  margin: 0 0 10px;
}

.field {
  display: grid;
  gap: 6px;
  color: var(--muted);
  font-weight: 700;
}

select {
  min-height: 42px;
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--ink);
  background: #fff;
}

.weak-list h2 {
  margin: 18px 0 10px;
  font-size: 1rem;
}

.topic-pill {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 10px;
  border-bottom: 1px solid var(--line);
  color: var(--muted);
}

.topic-pill strong {
  color: var(--ink);
}

.question-card {
  width: min(860px, 100%);
  min-height: 520px;
  padding: clamp(16px, 4vw, 28px);
  margin: 0 auto;
}

.empty-state {
  display: grid;
  min-height: 450px;
  place-content: center;
  text-align: center;
  color: var(--muted);
}

.question-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}

.tag {
  padding: 3px 8px;
  border-radius: 999px;
  color: var(--primary-dark);
  background: #dff2ef;
  font-size: 0.82rem;
  font-weight: 700;
}

.question-text {
  font-size: 1.05rem;
}

.question-text p {
  margin: 0 0 10px;
}

.options {
  display: grid;
  gap: 10px;
  margin-top: 20px;
}

.option {
  display: grid;
  grid-template-columns: 34px 1fr;
  gap: 10px;
  align-items: start;
  width: 100%;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--ink);
  background: #fff;
  text-align: left;
  font-weight: 600;
}

.option:hover {
  border-color: var(--primary);
  background: #f7fbfa;
}

.option.selected {
  border-color: var(--primary);
  background: #e7f4f2;
  box-shadow: inset 0 0 0 1px var(--primary);
}

.option.correct {
  border-color: #87c79d;
  background: #e5f5eb;
}

.option.wrong {
  border-color: #e3a09b;
  background: #fdecea;
}

.letter {
  display: inline-grid;
  width: 28px;
  height: 28px;
  place-items: center;
  border-radius: 50%;
  color: #fff;
  background: var(--primary);
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 18px;
}

.note-field {
  display: grid;
  gap: 6px;
  margin-top: 18px;
  color: var(--muted);
  font-weight: 800;
}

.note-field textarea {
  width: 100%;
  padding: 11px;
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--ink);
  background: #fff;
  font: inherit;
  resize: vertical;
}

.feedback {
  margin-top: 18px;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface-alt);
}

.revealed-meta {
  margin: 8px 0 10px;
}

.feedback h3 {
  margin: 0 0 8px;
}

.export-panel h2 {
  margin-top: 0;
}

.export-panel p {
  color: var(--muted);
}

.export-textarea {
  width: 100%;
  min-height: 420px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--ink);
  background: #fff;
  font: 0.92rem/1.45 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
  resize: vertical;
}

.view-heading {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

.view-heading h2 {
  margin: 0;
}

.observation-list {
  display: grid;
  gap: 12px;
}

.observation-item {
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
}

.observation-prompt {
  margin: 8px 0;
  font-weight: 700;
}

.observation-note {
  white-space: pre-wrap;
  margin: 10px 0;
  padding: 10px;
  border-left: 4px solid var(--primary);
  border-radius: 6px;
  background: var(--surface-alt);
}

.open-question-button {
  padding: 0 12px;
}

.artifact-table {
  width: 100%;
  margin: 14px 0;
  border-collapse: collapse;
  overflow: hidden;
  border-radius: 8px;
}

.artifact-table caption {
  margin-bottom: 6px;
  color: var(--muted);
  text-align: left;
  font-weight: 700;
}

.artifact-table th, .artifact-table td {
  padding: 8px 10px;
  border: 1px solid var(--line);
  text-align: center;
}

.artifact-code {
  margin: 14px 0;
}

.artifact-code figcaption {
  margin-bottom: 6px;
  color: var(--muted);
  font-weight: 700;
}

pre {
  overflow: auto;
  padding: 12px;
  border-radius: 8px;
  background: #172320;
  color: #eef9f7;
}

code {
  padding: 0.1rem 0.28rem;
  border-radius: 5px;
  background: #edf2f0;
}

.overline {
  text-decoration: overline;
  text-decoration-thickness: 1.5px;
}

@media (max-width: 820px) {
  .topbar {
    align-items: flex-start;
    flex-direction: column;
  }

  .topbar-button,
  .import-button {
    width: 100%;
    justify-content: center;
  }

  .metric-row {
    grid-template-columns: 1fr;
  }
}

  </style>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Questões</h1>
      <p>Treino aleatório</p>
    </div>
    <button id="configButton" type="button" class="topbar-button">Config</button>
  </header>

  <main class="app-shell">
    <section class="question-card" id="questionCard">
      <div class="empty-state">
        <h2>Carregando questões</h2>
        <p>O treino usa ordem aleatória e só mostra estatísticas depois da resposta.</p>
      </div>
    </section>
  </main>

  <script>
window.EMBEDDED_BANKS = {"combined":"===\n@id sim11-q01\n# simulado 11; bloco 1; complemento de 2 e overflow\n? Em complemento de 2 com 8 bits, execute `01011011 + 00110110` e avalie o resultado como numero assinado.\n- `10010001`, sem overflow, valor `-111`\n* `10010001`, com overflow, pois dois positivos geraram sinal 1\n- `10010001`, com carry e sem overflow, valor `145`\n- `10010010`, com overflow, pois houve carry para fora\n- `00010001`, sem overflow, valor `17`\n> `01011011=91` e `00110110=54`. A soma real seria 145, fora da faixa assinada de 8 bits (-128 a 127). O padrao de 8 bits e `10010001`, sinal negativo, logo houve overflow.\n\n===\n@id sim11-q02\n# simulado 11; bloco 1; subtracao binaria\n? Calcule `23 - 41` usando complemento de 2 em 8 bits. Qual padrao final e valor?\n* `11101110`, que representa `-18`\n- `00010010`, que representa `+18`\n- `11101101`, que representa `-19`\n- `10010010`, que representa `-110`\n- `11110010`, que representa `-14`\n> `23=00010111`. `41=00101001`; seu complemento de 2 e `11010111`. Soma: `00010111+11010111=11101110`. Invertendo e somando 1: `00010010=18`, portanto `-18`.\n\n===\n@id sim11-q03\n# simulado 11; bloco 1; bcd e correcao\n? Some os algarismos BCD `0101` e `0111`. Qual ajuste e resultado BCD correto?\n* Soma binaria `1100`; soma-se `0110`; resultado `0001 0010`\n- Soma binaria `1100`; nenhum ajuste; resultado `1100`\n- Soma binaria `1010`; soma-se `0110`; resultado `0001 0000`\n- Soma binaria `1100`; soma-se `0011`; resultado `1111`\n- Soma binaria `1001`; nenhum ajuste; resultado `1001`\n> BCD so permite 0000 a 1001 por digito. `5+7=12`, soma binaria `1100`, invalida em BCD. Soma-se 6 (`0110`) e obtem-se `1 0010`, isto e, decimal 12.\n\n===\n@id sim11-q04\n# simulado 11; bloco 1; codigo gray\n? O contador Gray de 4 bits apresenta `1101`. Convertendo para binario natural e somando `0011`, qual resultado binario de 4 bits?\n- `1110`\n- `1011`\n- `1001`\n* `1100`\n- `0110`\n> Gray para binario: primeiro bit 1; depois XOR acumulado: b1=1, b2=1 xor 1=0, b3=0 xor 0=0, b4=0 xor 1=1. Assim, Gray 1101 vira binario 1001. Somando 0011, resulta 1100.\n\n===\n@id sim11-q05\n# simulado 11; bloco 1; paridade e deteccao de erro\n? Uma palavra de 7 bits `1011010` usa paridade par acrescentada ao final. Depois da transmissao chega `10110101`. O receptor deve concluir:\n- A palavra recebida passa na paridade par e nenhum erro e detectado por esse criterio\n* A palavra recebida falha, pois possui numero impar de bits 1\n- A paridade corrige automaticamente o bit errado e recupera `10110100`\n- O erro so pode estar no bit de paridade, nunca nos dados\n- A paridade indica exatamente a posicao do bit invertido\n> Nos 8 bits recebidos `10110101` ha cinco bits 1, numero impar. Como a palavra usa paridade par, o receptor detecta erro. Paridade simples detecta quantidade impar de inversoes, mas nao localiza nem corrige o bit errado.\n\n===\n@id sim11-q06\n# simulado 11; bloco 1; faixa de representacao\n? Um campo de 9 bits em complemento de 2 guarda um deslocamento. Um valor decimal `-143` deve ser armazenado e depois somado a `+38`. Qual e o resultado decimal e ha overflow?\n* `-105`, sem overflow\n- `-181`, com overflow\n- `+105`, sem overflow\n- `-105`, com overflow por soma de sinais opostos\n- `+407`, pois 9 bits sao sempre sem sinal\n> Com 9 bits assinados a faixa e `-256` a `+255`. `-143+38=-105`, dentro da faixa. Soma de sinais opostos nao gera overflow em complemento de 2.\n\n===\n@id sim11-q07\n# simulado 11; bloco 2; demorgan e simplificacao\n? Simplifique `F = ((A + B'C)' + A'B)'` para uma forma equivalente mais direta.\n- `F = A(B + C')`\n- `F = A'(B + C)`\n* `F = A + B'C`\n- `F = (A + B)(A + C')`\n- `F = A' + BC'`\n> Pelo DeMorgan: ((A+B'C)' + A'B)' = (A+B'C)*(A+B') = A + B'C. Usa-se (A+X)(A+Y)=A+XY.\n\n===\n@id sim11-q08\n# simulado 11; bloco 2; forma canonica\n? Para `F(A,B,C)=Σm(1,2,5,7)`, qual alternativa descreve corretamente a forma POS canonica?\n* `ΠM(0,3,4,6)`\n- `ΠM(1,2,5,7)`\n- `ΣM(0,3,4,6)`\n- `Πm(0,3,4,6)`\n- `Σm(0,3,4,6)`\n> Em POS canonica usa-se o produto dos maxtermos das linhas em que a funcao vale 0. Se os 1s sao 1,2,5,7, os 0s sao 0,3,4,6; logo `ΠM(0,3,4,6)`.\n\n===\n@id sim11-q09\n# simulado 11; bloco 2; karnaugh 4 variaveis\n? Minimize a funcao do mapa de Karnaugh abaixo em SOP, usando os dont cares para obter a menor expressao.\n::tabela Mapa: linhas AB em Gray, colunas CD em Gray\n| 00; 01; 11; 10\n| 00; 0; 1; 0; 1\n| 01; 0; 1; X; 1\n| 11; 1; 1; X; 1\n| 10; 1; 1; 1; 1\n::fim\n- `F = A + C'D + B'C`\n* `F = A + B'D + CD'`\n- `F = AB + A'C + B'D`\n- `F = A + B'C' + CD`\n- `F = A'B + C'D + AB'`\n> Os 1s e X permitem um grupo de 8 cobrindo `A=1`, um grupo com `B=0,D=1` e outro com `C=1,D=0`. Assim, `F=A+B'D+CD'`.\n\n===\n@id sim11-q10\n# simulado 11; bloco 2; pos por karnaugh\n? Uma funcao vale 0 em `M(0,2,8,10)` e nao possui dont care. Qual forma POS minimizada e correta?\n* `F=(B+D)`\n- `F=(A+C)`\n- `F=(B'+D')`\n- `F=(A'+C')`\n- `F=(B+C')`\n> Os maxtermos 0,2,8,10 correspondem a `B=0` e `D=0` constantes, enquanto A e C variam. Para agrupar zeros em POS, variavel 0 entra direta: `(B+D)`.\n\n===\n@id sim11-q11\n# simulado 11; bloco 2; implementacao nand\n? A funcao `F = AB + C'D` deve ser implementada apenas com NAND de duas entradas. Considerando que inversores tambem sao NAND com entradas unidas, qual contagem minima razoavel de NANDs?\n- 5 NANDs\n* 4 NANDs\n- 6 NANDs\n- 3 NANDs\n- 7 NANDs\n> Gera-se C' com 1 NAND. Depois (AB)' com 1 NAND e (C'D)' com 1 NAND. A NAND final realiza ((AB)'*(C'D)')'=AB+C'D. Total: 4 NANDs.\n\n===\n@id sim11-q12\n# simulado 11; bloco 2; hazard por consenso booleano\n? A expressao `F=A'B + AC` deve ser protegida contra hazard estatico-1 quando A muda e `B=C=1`. Qual termo de consenso deve ser adicionado?\n* `BC`\n- `A'C`\n- `AB`\n- `B+C`\n- `A'A`\n> No padrao `X Y + X' Z`, o consenso e `YZ`. Aqui, `A'B + AC` tem consenso `BC`. Ele cobre a transicao em que A muda com B=C=1.\n\n===\n@id sim11-q13\n# simulado 11; bloco 2; expressao de circuito\n? O circuito abaixo usa inversores ideais e portas NAND/NOR. Qual e a expressao simplificada de F?\n::codigo Circuito descrito por sinais\nB_n = NOT B\nC_n = NOT C\nN1 = NAND(A, B_n)\nN2 = NOR(N1, C_n)\nF  = NAND(N2, C)\n::fim\n- `F=A'B + C`\n- `F=(A+B')C`\n* `F=A+B+C'`\n- `F=(A'+B)C'`\n- `F=A'B' + C`\n> N1=NAND(A,B')=(AB')'=A'+B. N2=NOR(N1,C')=(N1+C')'=N1'C=(AB')C. F=NAND(N2,C)=(AB'C*C)'=A'+B+C'.\n\n===\n@id sim11-q14\n# simulado 11; bloco 2; decoder e mintermos\n? Um decoder 3x8 tem saidas ativas em nivel alto `Y0..Y7`. Para implementar `F=Σm(2,3,6,7)` usando apenas o decoder e uma porta OR, qual interpretacao e simplificacao conceitual tambem e valida?\n* OR em `Y2,Y3,Y6,Y7`; a funcao equivale a `B=1`\n- OR em `Y2,Y3,Y6,Y7`; a funcao equivale a `C=1`\n- OR em `Y0,Y1,Y4,Y5`; a funcao equivale a `B=1`\n- OR em `Y1,Y3,Y5,Y7`; a funcao equivale a `A=1`\n- OR em todos os `Y`; a funcao e constante 1\n> Mintermos 2(010),3(011),6(110),7(111) sao exatamente as linhas em que `B=1`, com A e C variando. Portanto OR em Y2,Y3,Y6,Y7 implementa `F=B`.\n\n===\n@id sim11-q15\n# simulado 11; bloco 3; mux multiestagio\n? Um MUX 4:1 recebe `D0=A'B`, `D1=A+B`, `D2=A xor B`, `D3=0`. As selecoes sao `S1=C` e `S0=D`. Para `A=1,B=0,C=1,D=0`, a saida e:\n* `1`, pois seleciona `D2` e `A xor B=1`\n- `0`, pois seleciona `D3`\n- `0`, pois `A'B=0`\n- `1`, pois seleciona `D1` e `A+B=1`\n- `Z`, pois selecao 10 nao e valida\n> Com `S1S0=10`, seleciona-se `D2`. Para `A=1,B=0`, `A xor B=1`.\n\n===\n@id sim11-q16\n# simulado 11; bloco 3; comparador e prioridade\n? Um circuito primeiro compara dois numeros sem sinal de 4 bits A e B. Se `A>B`, a saida Z recebe a entrada 3 de um MUX 4:1; caso contrario, recebe a entrada 1. Com `A=1010`, `B=1001`, `D3=0`, `D1=1`, qual Z?\n* `0`\n- `1`\n- `A>B`\n- `Z`\n- `indeterminado`\n> Comeca S0. Entrada 1 leva a S1, saida 0; outra entrada 1 leva a S2, saida 1; entrada 0 leva a S1, saida 0; entrada 1 leva a S2, saida 1; entrada 0 leva a S1, saida 0. Sequencia: 0,1,0,1,0.\n\n===\n@id sim11-q18\n# simulado 11; bloco 3; fsm mealy\n? Uma maquina Mealy detecta o padrao sobreposto `101`. Estados representam prefixo reconhecido: S0 nenhum, S1 viu 1, S2 viu 10. A saida vale 1 na transicao de S2 com entrada 1. Para entrada `10101`, quantos pulsos de saida 1 ocorrem?\n* 2\n- 1\n- 3\n- 0\n- 4\n> A sequencia contem `101` nas posicoes 1-3 e 3-5, com sobreposicao. Portanto ocorrem dois pulsos de saida.\n\n===\n@id sim11-q19\n# simulado 11; bloco 3; sintese fsm com ff d\n? Uma FSM codificada por `Q1Q0` tem proximo estado `00->01`, `01->11`, `10->00`, `11->10`. Usando FF D, quais equacoes de excitacao sao corretas?\n* `D1=Q0` e `D0=Q1'`\n- `D1=Q1` e `D0=Q0'`\n- `D1=Q0'` e `D0=Q1`\n- `D1=Q1 xor Q0` e `D0=Q1'`\n- `D1=Q1+Q0` e `D0=Q1Q0`\n> Tabela: para 00, D=01; 01, D=11; 10, D=00; 11, D=10. Logo `D1=Q0` e `D0=Q1'`.\n\n===\n@id sim11-q20\n# simulado 11; bloco 3; encoder de prioridade\n? Um encoder de prioridade 8:3 prioriza o maior indice. Entradas ativas: `I1,I4,I6`. A saida binaria e o sinal valido devem ser:\n* `110` e valido 1\n- `001` e valido 1\n- `100` e valido 1\n- `011` e valido 0\n- `111` e valido 1\n> Com prioridade para o maior indice, escolhe-se I6. O codigo de 6 e `110`, e existe entrada ativa, logo valido=1.\n\n===\n@id sim11-q21\n# simulado 11; bloco 3; demux e decodificacao\n? Um DEMUX 1:4 recebe `EN=1` e selecao `S1S0=11`. A saida selecionada passa por um inversor antes de acionar um sinal ativo-baixo `CS_n`. Qual saida do DEMUX deve estar em 1 para selecionar o dispositivo 3?\n* `Y3=1`, pois o inversor gera `CS_n=0`\n- `Y0=1`, pois 11 seleciona a primeira saida em Gray\n- `Y3=0`, pois sinal ativo-baixo exige DEMUX em zero\n- `Y1=1`, pois 11 decimal equivale a 1 em modulo 2\n- `todas Y=1`, pois EN habilita todas as saidas\n> Selecao 11 escolhe a saida 3. Como depois ha inversor e o chip select e ativo-baixo, `Y3=1` gera `CS_n=0`.\n\n===\n@id sim11-q22\n# simulado 11; bloco 4; latch sr\n? Um latch SR com NOR recebe brevemente `S=1,R=0`, depois `S=0,R=0`, e em seguida `S=0,R=1`. Partindo de `Q=0`, qual sequencia conceitual de Q?\n* `1`, mantem `1`, depois `0`\n- `0`, mantem `0`, depois `1`\n- `1`, depois indefinido, depois `0`\n- `0`, depois `1`, depois mantem `1`\n- `Z` em todos os estados sem S e R ativos\n> No latch SR NOR, S=1 seta Q. Com S=R=0, o estado e mantido. Depois R=1 reseta Q para 0.\n\n===\n@id sim11-q23\n# simulado 11; bloco 4; ff t com ff d\n? Para implementar um FF T usando um FF D, qual ligacao gera toggle quando T=1 e manutencao quando T=0?\n* `D = T xor Q`\n- `D = T + Q`\n- `D = TQ`\n- `D = T xor Q'`\n- `D = Q'` sempre\n> Se T=0, `D=Q`, mantem. Se T=1, `D=Q'`, alterna. Isso e exatamente `D=T xor Q`. Ligar apenas `Q'` em D faria toggle em toda borda.\n\n===\n@id sim11-q24\n# simulado 11; bloco 4; contador sincrono\n? Um contador sincrono modulo 10 usa 4 FFs e conta 0 a 9. Se for implementado detectando o estado 1010 para resetar a 0000, o que deve ser observado?\n* O estado 1010 e transitorio/ilegal do modulo desejado e deve acionar limpeza para voltar a 0000\n- O estado 1010 representa decimal 9, logo deve ser o ultimo estado valido\n- Com 4 FFs nao e possivel representar modulo 10\n- O reset deve ocorrer em 1111, pois todo contador de 4 bits e modulo 16\n- O contador passa a ser modulo 11 se detectar 1010\n> Modulo 10 usa estados 0000 a 1001. O estado 1010 corresponde a 10 e deve ser usado como deteccao de retorno/reset, dependendo do projeto.\n\n===\n@id sim11-q25\n# simulado 11; bloco 4; temporizacao setup\n? Um caminho registrador-combinacional-registrador tem `tCQmax=0,8 ns`, atraso combinacional maximo `6,7 ns`, `tsetup=1,1 ns` e skew desfavoravel de `0,4 ns`. Qual periodo minimo aproximado?\n* `9,0 ns`\n- `8,6 ns`\n- `7,9 ns`\n- `6,7 ns`\n- `10,1 ns`\n> Para setup, soma-se `tCQmax + tPDmax + tsetup + skew_desfavoravel`: `0,8+6,7+1,1+0,4=9,0 ns`.\n\n===\n@id sim11-q26\n# simulado 11; bloco 4; temporizacao hold\n? No mesmo estilo de caminho, `tCQmin=0,3 ns`, atraso combinacional minimo `0,6 ns`, `thold=1,2 ns`. Ignorando skew, ha violacao de hold?\n* Sim, pois `0,3+0,6=0,9 ns` e menor que `1,2 ns`\n- Nao, pois o atraso maximo e que importa para hold\n- Nao, pois `0,9 ns` e maior que zero\n- Sim, mas apenas se o periodo de clock for menor que 0,9 ns\n- Nao, hold e resolvido aumentando a frequencia\n> Hold verifica se o dado novo chega cedo demais. Usa atrasos minimos: `0,3+0,6=0,9 ns`, menor que `thold=1,2 ns`, entao viola hold.\n\n===\n@id sim11-q27\n# simulado 11; bloco 4; registrador de deslocamento\n? Um registrador serial-in/parallel-out de 4 bits inicia em `0000`. A cada borda desloca para a esquerda e entra novo bit em Q0. Para entrada serial `1,0,1,1`, qual conteudo final `Q3Q2Q1Q0`?\n* `1011`\n- `1101`\n- `0110`\n- `1110`\n- `0101`\n> Deslocando para esquerda com entrada em Q0: 0001, 0010, 0101, 1011.\n\n===\n@id sim11-q28\n# simulado 11; bloco 4; frequencia de contador ripple\n? Um contador ripple de 5 FFs recebe clock de `64 MHz`. Considerando a saida do ultimo FF como divisao ideal, qual frequencia aparece nele?\n* `2 MHz`\n- `4 MHz`\n- `8 MHz`\n- `1 MHz`\n- `32 MHz`\n> Cada FF divide por 2. O quinto bit divide por `2^5=32`. `64 MHz/32=2 MHz`.\n\n===\n@id sim11-q29\n# simulado 11; bloco 5; ponto fixo\n? Um numero em ponto fixo Q4.3, complemento de 2, esta armazenado como `1101011`. Qual valor decimal?\n* `-2,625`\n- `-5,250`\n- `13,375`\n- `-1,625`\n- `+6,750`\n> Ha 7 bits totais com 3 fracionarios. `1101011` em complemento de 2 vale `-21` como inteiro. Escala `2^-3`: `-21/8=-2,625`.\n\n===\n@id sim11-q30\n# simulado 11; bloco 5; ieee 754 simples\n? No IEEE 754 simples, um numero normalizado tem sinal 1, expoente armazenado `10000010` e fracao iniciando por `010000...`. Qual valor?\n* `-10,0`\n- `-5,0`\n- `+10,0`\n- `-2,5`\n- `-20,0`\n> Expoente armazenado 130, expoente real `130-127=3`. Mantissa `1,010...` = 1,25. Valor com sinal negativo: `-1,25*2^3=-10`.\n\n===\n@id sim11-q31\n# simulado 11; bloco 5; normalizacao ieee\n? O decimal `13,25` deve ser representado como numero normalizado em binario para IEEE 754 simples. Qual par mantissa normalizada e expoente armazenado esta correto?\n* `1,10101 x 2^3`; expoente armazenado `130`\n- `1,10101 x 2^2`; expoente armazenado `129`\n- `0,110101 x 2^4`; expoente armazenado `131`\n- `1,0101 x 2^3`; expoente armazenado `130`\n- `1,10101 x 2^4`; expoente armazenado `131`\n> `13,25 = 1101,01_2 = 1,10101 x 2^3`. Em simples, bias 127; expoente armazenado `3+127=130`.\n\n===\n@id sim11-q33\n# simulado 11; bloco 5; subtrator e flags\n? Uma ULA de 4 bits faz `A-B` via `A + (~B+1)`. Para `A=0011` e `B=0101`, qual resultado e flag Z/N no sentido usual?\n* `1110`, Z=0, N=1\n- `0010`, Z=0, N=0\n- `0000`, Z=1, N=0\n- `1101`, Z=0, N=1\n- `1110`, Z=1, N=1\n> `3-5=-2`. Em 4 bits complemento de 2, -2 e `1110`. Resultado nao e zero, entao Z=0; MSB=1, entao N=1.\n\n===\n@id sim11-q34\n# simulado 11; bloco 5; shifter aritmetico\n? Um registrador de 8 bits contem `10010110`, interpretado como complemento de 2. Apos deslocamento aritmetico para a direita de 2 posicoes, qual padrao resulta?\n* `11100101`\n- `00100101`\n- `11100110`\n- `10010100`\n- `01100101`\n> Deslocamento aritmetico a direita replica o bit de sinal 1. `10010110 >> 1 = 11001011`; novamente: `11100101`.\n\n===\n@id sim11-q35\n# simulado 11; bloco 5; ula e controle\n? Uma ULA recebe opcode `00=AND`, `01=OR`, `10=ADD`, `11=SUB`. Com A=`0110`, B=`0011` e opcode `11`, qual saida e quais sinais internos sao coerentes?\n* `0011`; B e invertido e carry-in inicial vale 1\n- `1001`; B passa direto e carry-in inicial vale 0\n- `0111`; opera OR e ignora carry\n- `0010`; B e deslocado antes da soma\n- `0000`; opcode 11 sempre zera a ULA\n> SUB e feita como `A + (~B) + 1`. `6-3=3`, logo saida `0011`.\n\n===\n@id sim11-q36\n# simulado 11; bloco 6; nmos/pmos e nivel forte/fraco\n? Em logica MOS, por que um NMOS isolado nao e bom para transmitir nivel logico 1 forte?\n* Porque conforme a saida sobe, `Vgs` diminui e o NMOS deixa de conduzir bem antes de chegar a `VDD`\n- Porque NMOS nunca conduz corrente em nenhuma direcao\n- Porque NMOS conduz apenas numeros negativos e bloqueia positivos\n- Porque o gate do NMOS precisa estar em alta impedancia para conduzir 1\n- Porque o dreno sempre deve ser aterrado\n> NMOS passa 0 forte, mas passa 1 degradado quando usado como chave de passagem simples. Ao subir a tensao no no de saida, `Vgs` cai e a conducao enfraquece.\n\n===\n@id sim11-q37\n# simulado 11; bloco 6; cmos dual\n? Para implementar uma porta CMOS estatica cuja rede pull-down conduz quando `F'=A(B+C)`, a saida logica F e a rede pull-up devem ser:\n* `F=A'+B'C'`; PMOS de A em paralelo com PMOS de B e C em serie\n- `F=A(B+C)`; PMOS com A em serie e B,C em paralelo\n- `F=A'(B+C)`; PMOS todos em serie\n- `F=A+B+C`; PMOS todos em paralelo\n- `F=AB+AC`; PMOS replica exatamente a rede NMOS\n> Se o pull-down implementa `F'=A(B+C)`, a saida e `F=(A(B+C))'=A'+B'C'`. A rede PMOS e dual: serie vira paralelo e paralelo vira serie, com PMOS conduzindo para entradas 0.\n\n===\n@id sim11-q38\n# simulado 11; bloco 6; porta cmos\n? Uma porta CMOS tem pull-down NMOS com A e B em paralelo, em serie com C. Que funcao a saida implementa?\n* `F=(A+B)' + C'`\n- `F=(A+B)C`\n- `F=(A+B+C)'`\n- `F=AB+C'`\n- `F=A+B+C`\n> Pull-down conduz quando `(A+B)C=1`, isto e, quando `F'= (A+B)C`. Logo `F=((A+B)C)'=(A+B)'+C'`.\n\n===\n@id sim11-q39\n# simulado 11; bloco 6; potencia dinamica multiestagio\n? Um bloco CMOS tem capacitancia efetiva `80 pF`, atividade `α=0,25`, `VDD=1,2 V` e clock `100 MHz`. Qual potencia dinamica aproximada usando `P=αCV²f`?\n* `2,88 mW`\n- `288 mW`\n- `28,8 uW`\n- `0,288 mW`\n- `14,4 mW`\n> `P=0,25*80e-12*(1,2)^2*100e6` = `0,25*80*1,44*1e-4 W` = `2,88e-3 W` = `2,88 mW`.\n\n===\n@id sim11-q40\n# simulado 11; bloco 6; energia e frequencia\n? Um circuito consome `4 mW` dinamicos a `50 MHz` com mesma atividade. Se a frequencia dobra e VDD cai de `1,2 V` para `1,0 V`, qual nova potencia aproximada?\n* `5,56 mW`\n- `8,00 mW`\n- `2,78 mW`\n- `4,00 mW`\n- `6,67 mW`\n> Potencia dinamica escala com `V²f`. Razao = `(1,0²/1,2²)*(100/50)=1/1,44*2=1,3889`. `4 mW*1,3889≈5,56 mW`.\n\n===\n@id sim11-q41\n# simulado 11; bloco 6; caminho critico combinacional\n? Um circuito tem tres caminhos possiveis ate a saida: P1 com 2 NANDs de 0,7 ns e 1 NOR de 1,0 ns; P2 com 1 INV de 0,2 ns e 2 XORs de 1,4 ns; P3 com 3 ANDs de 0,8 ns. Qual atraso de propagacao de pior caso?\n* `3,0 ns`\n- `2,8 ns`\n- `2,4 ns`\n- `3,2 ns`\n- `1,4 ns`\n> P1: `2*0,7+1,0=2,4 ns`. P2: `0,2+2*1,4=3,0 ns`. P3: `3*0,8=2,4 ns`. Pior caso: 3,0 ns.\n\n===\n@id sim11-q42\n# simulado 11; bloco 6; glitch e hazard\n? Em `F=A'B + AC + BC`, com `B=C=1` e A variando, qual afirmacao e correta?\n* O termo `BC` e consenso e tende a remover o hazard estatico-1 entre `A'B` e `AC`\n- O termo `BC` cria obrigatoriamente um hazard, pois aumenta a quantidade de portas\n- Hazard so existe em circuitos sequenciais, nunca em combinacionais\n- Glitch e sempre erro funcional permanente, nao pulso temporario\n- A duracao do glitch e sempre igual ao periodo do clock\n> Sem consenso, a troca entre o caminho `A'B` e `AC` pode gerar pulso por atrasos diferentes. `BC` mantem a cobertura quando B=C=1.\n\n===\n@id sim11-q43\n# simulado 11; bloco 7; capacidade de memoria\n? Uma memoria possui 13 linhas de endereco e barramento de dados de 16 bits. Qual capacidade total?\n* `16 KiB`\n- `8 KiB`\n- `32 KiB`\n- `128 Kib` apenas, sem conversao para bytes\n- `64 KiB`\n> `2^13=8192` palavras. Cada palavra tem 16 bits = 2 bytes. Capacidade = `8192*2=16384 bytes=16 KiB`.\n\n===\n@id sim11-q44\n# simulado 11; bloco 7; banco de registradores\n? Um banco tem 32 registradores de 32 bits, duas portas de leitura e uma de escrita. Quantos bits de endereco sao necessarios por porta para selecionar um registrador?\n* `5`\n- `6`\n- `10`\n- `32`\n- `64`\n> Para selecionar 32 registradores, cada porta precisa de `log2(32)=5` bits de endereco. Ter duas leituras nao dobra os bits por porta; apenas duplica portas/caminhos.\n\n===\n@id sim11-q45\n# simulado 11; bloco 7; sram versus dram\n? Uma cache L1 precisa de baixa latencia e muitas leituras por ciclo; uma memoria principal precisa de alta densidade e custo por bit menor. A associacao mais adequada e:\n* Cache com SRAM; memoria principal com DRAM\n- Cache com DRAM; memoria principal com SRAM\n- Ambas com ROM, pois sao acessadas muitas vezes\n- Cache com PROM; memoria principal com PAL\n- Ambas com flip-flops discretos, pois sempre sao mais densos\n> SRAM e rapida e nao precisa de refresh, mas ocupa mais area por bit. DRAM e mais densa/barata, mas precisa de refresh e costuma ser usada como memoria principal.\n\n===\n@id sim11-q46\n# simulado 11; bloco 7; prom como tabela verdade\n? Uma PROM implementa 4 entradas e 3 saidas logicas. Considerando implementacao direta por tabela verdade, quantos bits de armazenamento de saida sao programados?\n* `48 bits`\n- `12 bits`\n- `16 bits`\n- `64 bits`\n- `7 bits`\n> Com 4 entradas ha `2^4=16` enderecos/linhas. Cada linha possui 3 bits de saida. Total `16*3=48 bits`.\n\n===\n@id sim11-q47\n# simulado 11; bloco 7; pla pal prom\n? Qual descricao esta correta para as matrizes logicas classicas?\n* PROM: plano AND fixo/decodificador e OR programavel; PLA: AND e OR programaveis; PAL: AND programavel e OR fixo\n- PROM: AND e OR programaveis; PLA: AND fixo e OR fixo; PAL: apenas memorias RAM internas\n- PROM: OR fixo; PLA: apenas tabela sequencial; PAL: usado somente para armazenar dados volateis\n- PROM, PLA e PAL sao sempre reprogramaveis infinitamente sem tecnologia adicional\n- PAL tem plano AND fixo e OR programavel, ao contrario da PROM\n> A tabela classica: PROM usa decodificador/AND fixo para todos os mintermos e programa conexoes OR; PLA programa AND e OR; PAL programa AND e tem OR fixo.\n\n===\n@id sim11-q48\n# simulado 11; bloco 7; pal com or fixo\n? Em uma PAL, uma saida possui uma porta OR fixa recebendo no maximo 4 termos-produto vindos da matriz AND programavel. Se a funcao minimizada exige 5 produtos distintos para uma unica saida, o que isso implica?\n* Ela nao cabe diretamente nessa saida sem reestruturar/usar outra macrocelula/reduzir a funcao\n- Ela cabe normalmente, pois OR fixo significa quantidade ilimitada de entradas\n- Ela vira automaticamente uma PLA, sem custo adicional\n- Basta programar mais um endereco de memoria como em DRAM\n- A funcao passa a ser sequencial por ter mais de 4 produtos\n> OR fixo limita quantos produtos podem alimentar aquela saida. Se a funcao precisa de 5 termos e a saida aceita 4, e necessario reestruturar, compartilhar logica se o dispositivo permitir, escolher outra saida/dispositivo ou simplificar.\n\n===\n@id sim11-q49\n# simulado 11; bloco 7; lut em fpga\n? Uma LUT de 6 entradas em FPGA implementa diretamente qualquer funcao booleana de ate 6 variaveis. Quantos bits de configuracao sao necessarios para a tabela dessa LUT?\n* `64`\n- `6`\n- `12`\n- `36`\n- `128`\n> Uma LUT de k entradas armazena a tabela verdade completa com `2^k` linhas. Para k=6, sao `2^6=64` bits.\n\n===\n@id sim11-q50\n# simulado 11; bloco 8; assembly load/store\n? Considere o trecho Nios II abaixo. Ao final, qual valor fica em `resultado`?\n::codigo Trecho assembly\n.data\na: .word 9\nb: .word 4\nresultado: .word 0\n.text\nMOVIA r1, a\nLDW r2, 0(r1)\nMOVIA r1, b\nLDW r3, 0(r1)\nADD r4, r2, r3\nMOVIA r1, resultado\nSTW r4, 0(r1)\n::fim\n* `13`\n- `8`\n- `5`\n- `21`\n- `0`\n> Carrega a=9 em r2 e b=4 em r3. `ADD r4,r2,r3` calcula 13. Depois armazena r4 no endereco de resultado.\n\n===\n@id sim11-q51\n# simulado 11; bloco 8; assembly chamada de funcao\n? Um programa executa `CALL sub`. Dentro de `sub` nao ha `RET`; apos algumas instrucoes aparece uma label comum `fim:` com `BR fim`. Qual consequencia conceitual?\n* A execucao nao retorna automaticamente ao ponto apos o CALL; sem RET, o fluxo continua ou fica preso onde os desvios levarem\n- O processador retorna automaticamente ao CALL quando encontra qualquer label\n- `BR fim` usa o registrador `ra` e volta para a chamada\n- CALL e igual a BEQ, portanto nao salva endereco de retorno\n- Labels sao funcoes e sempre possuem retorno implicito\n> `CALL` salva endereco de retorno em `ra`, mas so `RET` usa esse endereco para voltar. Label e apenas nome de endereco; nao ha retorno automatico.\n\n===\n@id sim11-q52\n# simulado 11; bloco 8; modos de enderecamento\n? Em uma ISA load/store, a instrucao `LDW r5, 12(r2)` usa qual modo e qual operacao efetiva?\n* Enderecamento base+deslocamento; carrega em r5 a palavra no endereco `r2+12`\n- Imediato; coloca o literal 12 diretamente em r5\n- Registrador direto; copia r2 para r5 e ignora o 12\n- Indireto por pilha; desempilha 12 bytes para r5\n- Absoluto; acessa sempre o endereco 12 da memoria\n> O formato `deslocamento(base)` calcula endereco efetivo somando registrador base e deslocamento imediato. O dado da memoria nesse endereco vai para o registrador destino.\n\n===\n@id sim11-q53\n# simulado 11; bloco 8; formato de instrucao\n? Uma ISA tem instrucoes de 32 bits. No formato R, usa opcode de 6 bits, tres campos de registrador de 5 bits e funct de 6 bits. Quantos bits sobram para campos auxiliares como shamt/reservado?\n* `5 bits`\n- `10 bits`\n- `6 bits`\n- `11 bits`\n- `0 bits`\n> Usados: `6 + 3*5 + 6 = 27`. Sobram `32-27=5` bits.\n\n===\n@id sim11-q54\n# simulado 11; bloco 8; datapath single-cycle\n? Em um datapath single-cycle load/store, qual conjunto de sinais e caminho e mais coerente para uma instrucao de load?\n* ULA soma base+offset; memoria de dados e lida; write-back vem da memoria; escrita no registrador habilitada\n- ULA subtrai dois registradores; memoria escreve; PC recebe dado da memoria; registrador destino desabilitado\n- ULA faz AND; memoria de instrucao e escrita; branch sempre tomado\n- Banco de registradores nao e lido; imediato vira opcode; resultado vem do PC+4\n- Memoria de dados e escrita com o valor do registrador destino\n> Load calcula endereco com ULA, le memoria de dados e escreve o dado lido no banco de registradores.\n\n===\n@id sim11-q55\n# simulado 11; bloco 8; branch e controle\n? Uma instrucao `BEQ r2,r3,label` passa pela ULA/subtrator para comparar. Se `r2=7` e `r3=7`, quais sinais conceituais sao esperados?\n* Flag zero ativa; controle de branch permite carregar o PC com o alvo\n- Flag negativo ativa; branch nunca pode alterar PC\n- Flag overflow ativa; registrador destino recebe label\n- Flag carry ativa; memoria de dados escreve o endereco label\n- Nenhuma flag muda, pois BEQ nao usa ULA\n> Uma forma comum de comparar igualdade e subtrair. Se r2-r3=0, a flag zero ativa. Com BEQ, zero ativo habilita escolha do PC alvo.\n\n===\n@id sim11-q56\n# simulado 11; bloco 8; pipeline conceitual\n? Mesmo que a aula foque datapath basico, considere um processador com busca, decodificacao, execucao, memoria e write-back. Qual dependencia aparece em `LDW r2,0(r1)` seguido imediatamente de `ADD r3,r2,r4`?\n* Dependencia de dados RAW: a ADD precisa ler r2 produzido pelo load\n- Dependencia WAR: o load precisa ler r2 antes da ADD escrever\n- Dependencia WAW: ambas escrevem em r2\n- Dependencia estrutural impossivel, pois loads nao usam memoria\n- Nenhuma dependencia, pois registradores sempre atualizam antes da proxima instrucao em qualquer projeto\n> A instrucao ADD le r2, que sera produzido pela instrucao anterior LDW. Isso e read-after-write (RAW), tipico caso que pode exigir stall/forwarding em pipeline.\n\n===\n@id sim11-q57\n# simulado 11; bloco 8; integracao assembly-memoria\n? Um vetor de palavras comeca no endereco em r1. Cada palavra tem 4 bytes. Qual instrucao carrega o terceiro elemento do vetor em r6, considerando indice humano 1,2,3?\n* `LDW r6, 8(r1)`\n- `LDW r6, 3(r1)`\n- `LDW r6, 12(r1)`\n- `STW r6, 8(r1)`\n- `LDW r1, 8(r6)`\n> O primeiro elemento esta no deslocamento 0, o segundo em 4, o terceiro em 8. Como e carga para r6: `LDW r6, 8(r1)`.\n\n===\n@id sim11-q58\n# simulado 11; bloco 2; karnaugh com termo isolado\n? No mapa abaixo, minimize em SOP usando os dont cares. Atenção: nem todo 1 entra em grupo grande.\n::tabela Mapa: 1 = deve cobrir; X = dont care\n| 00; 01; 11; 10\n| 00; 0; 1; 1; 1\n| 01; 0; 0; 1; 1\n| 11; 0; 0; X; 1\n| 10; 0; 1; X; 1\n::fim\n* `F=A'C + B'D + ABC'`\n- `F=A'C + B'D`\n- `F=A'B + CD + AB'C'`\n- `F=C + B'D`\n- `F=A'C' + BD + ABC`\n> Ha grupos grandes para `A'C` e `B'D`, mas sobra cobertura especifica exigindo termo menor `ABC'`. Essa e uma questao para evitar o vicio de procurar so grupos obvios.\n\n===\n@id sim11-q59\n# simulado 11; bloco 6; potencia e temporizacao integradas\n? Um bloco combinacional tem atraso critico de `7,5 ns`. Registradores ao redor somam `tCQmax+tsetup=1,5 ns`. O bloco opera em `V=1,0 V`, `C=120 pF`, `α=0,2`. Se o clock for ajustado para o maior valor seguro de setup, qual potencia dinamica aproximada?\n* `2,67 mW`\n- `24,0 mW`\n- `1,33 mW`\n- `13,3 mW`\n- `0,267 mW`\n> Periodo minimo: `7,5+1,5=9,0 ns`, entao `f≈111,1 MHz`. Potencia: `0,2*120e-12*1^2*111,1e6≈2,67 mW`.\n\n===\n@id sim11-q60\n# simulado 11; bloco 8; datapath com sequencia de instrucoes\n? Considere a sequencia conceitual em uma ISA load/store: `LDW r2,0(r1)`; `ADDI r2,r2,4`; `STW r2,0(r1)`; `BEQ r2,r3,L`. Se inicialmente `mem[r1]=8` e `r3=12`, o que ocorre?\n* `mem[r1]` vira 12 e o branch e tomado\n- `mem[r1]` vira 8 e o branch e tomado\n- `mem[r1]` vira 12 e o branch nao e tomado\n- `r3` vira 8 e a memoria nao muda\n- O store escreve no registrador r1, nao na memoria\n> O load coloca 8 em r2. O ADDI transforma r2 em 12. O store grava 12 em `mem[r1]`. O BEQ compara r2=12 com r3=12, entao o desvio e tomado.\n\n===\n@id sim12-q01\n# simulado 12; bloco 2; algebra booleana com consenso\n? Simplifique `F=(A+B)(A+C)(B+C)`.\n- `F=A+B+C`\n- `F=A+BC`\n- `F=ABC`\n- `F=(A+B+C)'`\n* `F=AB+AC+BC`\n> `(A+B)(A+C)=A+BC`. Entao `(A+BC)(B+C)=AB+AC+BC`.\n\n===\n@id sim12-q02\n# simulado 12; bloco 8; assembly fluxo com memoria\n? Qual valor final fica em `saida`?\n::codigo Trecho Nios II\n.data\nx: .word 12\ny: .word 5\nsaida: .word 0\n.text\nMOVIA r1, x\nLDW r2, 0(r1)\nMOVIA r1, y\nLDW r3, 0(r1)\nBEQ r2, r3, iguais\nADD r4, r2, r3\nBR salva\niguais:\nSUB r4, r2, r3\nsalva:\nMOVIA r1, saida\nSTW r4, 0(r1)\n::fim\n- `12`\n- `5`\n- `29`\n* `17`\n- `0`\n> Carrega x=12 e y=5. Como x != y, soma x+y=17 e salva.\n\n===\n@id sim12-q03\n# simulado 12; bloco 5; ponto fixo q3.4\n? Um valor Q3.4 em complemento de 2 esta em `1011011`. Qual valor decimal?\n- `-4,625`\n- `+5,6875`\n* `-2,3125`\n- `-2,6875`\n- `+2,3125`\n> Como inteiro de 7 bits, `1011011` e `-37`. Com 4 bits fracionarios: `-37/16=-2,3125`.\n\n===\n@id sim12-q04\n# simulado 12; bloco 1; complemento de 2 multioperacao\n? Em complemento de 2 com 8 bits, calcule `01010110 - 01111001`. Qual padrao final e interpretacao assinada?\n- `00100011`, valor `+35`\n- `11011100`, valor `-36`\n* `11011101`, valor `-35`\n- `10101111`, valor `-81`\n- `11100011`, valor `-29`\n> 86 - 121 = -35. Em 8 bits, 35 e `00100011`; invertendo e somando 1: `11011101`.\n\n===\n@id sim12-q05\n# simulado 12; bloco 6; pass transistor nmos\n? Um NMOS usado como chave de passagem tem gate em `VDD` e tenta transmitir nivel alto. O problema esperado e:\n* O nivel alto pode sair degradado, aproximadamente limitado por `VDD - Vt`\n- O nivel baixo sai degradado e para em `Vt`\n- Ele nunca conduz quando gate esta em `VDD`\n- Ele transforma qualquer entrada em alta impedancia\n- Ele inverte automaticamente o sinal transmitido\n> NMOS passa 0 forte e 1 fraco/degradado quando usado isoladamente como chave de passagem.\n\n===\n@id sim12-q06\n# simulado 12; bloco 3; mux com funcao residual\n? Uma funcao `F(A,B,C)=Σm(1,2,6,7)` sera implementada por MUX 4:1 usando `A,B` como selecao. Quais entradas `I0..I3` devem ser usadas em funcao de C?\n* `I0=C, I1=C', I2=0, I3=1`\n- `I0=C', I1=C, I2=1, I3=0`\n- `I0=0, I1=C, I2=C', I3=1`\n- `I0=C, I1=1, I2=0, I3=C'`\n- `I0=1, I1=0, I2=C, I3=C'`\n> Para AB=00, mintermos 0/1: so m1 entra, logo C. AB=01: m2 entra e m3 nao, logo C'. AB=10: m4/m5 nao entram, 0. AB=11: m6/m7 entram, 1.\n\n===\n@id sim12-q07\n# simulado 12; bloco 7; memoria capacidade mista\n? Uma memoria tem organizacao `4K x 32`. Qual capacidade em bytes?\n- `4 KiB`\n- `32 KiB`\n- `128 KiB`\n* `16 KiB`\n- `4096 KiB`\n> `4K=4096` palavras. Cada palavra tem 32 bits = 4 bytes. Total `4096*4=16384 bytes=16 KiB`.\n\n===\n@id sim12-q08\n# simulado 12; bloco 4; latch d transparente\n? Um latch D ativo alto recebe `EN=1` enquanto D muda de 0 para 1. Depois `EN` cai para 0 e D volta para 0. Qual Q final?\n- `0`, pois D final e 0\n- `Z`, pois latch fechado fica em alta impedancia\n- `indefinido`, pois D mudou com EN=1\n* `1`, pois o latch capturou 1 antes de fechar\n- `toggle`, pois latch D alterna em toda mudanca\n> Com EN=1 o latch e transparente. Quando EN cai, ele armazena o ultimo valor propagado, que era 1.\n\n===\n@id sim12-q09\n# simulado 12; bloco 5; soma ponto fixo com saturacao conceitual\n? Em Q3.2 assinado, a faixa e `-4,00` a `+3,75`. Some `2,75 + 1,50`. O que acontece?\n- A soma real e `3,25`, dentro da faixa\n- A soma real e `4,25`, mas Q3.2 guarda ate `7,75`\n- A soma real e `-3,75` por definicao de ponto fixo\n* A soma real e `4,25`, fora da faixa; ocorreria overflow se armazenado em Q3.2\n- Nao existe overflow em ponto fixo, apenas em ponto flutuante\n> Q3.2 tem 5 bits totais assinados e escala 1/4. A maior representacao positiva e `01111 = 15/4 = 3,75`.\n\n===\n@id sim12-q10\n# simulado 12; bloco 2; demorgan multinivel\n? Qual expressao e equivalente a `((A'B + C)' + D)'`?\n- `D(A+B'C')`\n- `D'((A+B')C')`\n* `D'(A'B + C)`\n- `D + A'B + C`\n- `D'(A+B'+C')`\n> Seja `X=(A'B+C)'`. `(X+D)'=X'D'=D'(A'B+C)`.\n\n===\n@id sim12-q11\n# simulado 12; bloco 6; cmos rede complexa\n? Uma rede pull-down NMOS conduz quando `(A+B)(C+D)=1`. Qual funcao F a porta CMOS estatica implementa?\n- `F=(A+B)(C+D)`\n- `F=A'+B'+C'+D'`\n- `F=AB+CD`\n* `F=A'B' + C'D'`\n- `F=(A'+B')(C'+D')`\n> A saida e o complemento da condicao de conducao do pull-down: `F=((A+B)(C+D))'=(A+B)' + (C+D)'=A'B' + C'D'`.\n\n===\n@id sim12-q12\n# simulado 12; bloco 8; assembly erro stw\n? Qual instrucao armazena corretamente o valor de `r4` na variavel cujo endereco esta em `r1`?\n- `STW r1, 0(r4)`\n- `LDW r4, 0(r1)`\n* `STW r4, 0(r1)`\n- `STW r4, r1`\n- `MOVIA r4, 0(r1)`\n> Em Nios II, `STW fonte, deslocamento(base)`. O valor fonte e r4; o endereco base esta em r1.\n\n===\n@id sim12-q13\n# simulado 12; bloco 3; comparador signed unsigned\n? Compare `A=1001` e `B=0111`. Qual afirmacao e correta?\n- Como sem sinal e signed, `A>B`\n- Como sem sinal e signed, `A<B`\n- Como sem sinal, `AB`\n* Como sem sinal, `A>B`; como complemento de 2, `A<B`\n- Nao e possivel comparar porque os bits tem larguras iguais\n> `1001` sem sinal e 9, maior que 7. Em complemento de 2 de 4 bits, `1001=-7`, menor que `0111=+7`.\n\n===\n@id sim12-q14\n# simulado 12; bloco 1; overflow signed versus carry\n? Some `10110110` e `11001011` como valores de 8 bits em complemento de 2. Qual conclusao e correta?\n* `10000001`, sem overflow assinado; soma real `-127`\n- `10000001`, com overflow porque houve carry de saida\n- `01111111`, com overflow; soma real `+127`\n- `10000010`, sem overflow; soma real `-126`\n- `00000001`, sem overflow; carry foi descartado\n> Os operandos sao negativos: `10110110=-74` e `11001011=-53`. Soma real = `-127`, que cabe em 8 bits. Resultado `10000001`. Carry de saida nao e o criterio de overflow assinado.\n\n===\n@id sim12-q15\n# simulado 12; bloco 4; jk para transicao\n? Um FF JK esta com `Q=1`. Para que proximo estado seja `Q+=0`, quais entradas sao suficientes?\n- `J=1`, com `K` indiferente\n* `K=1`, com `J` indiferente\n- `J=0,K=0`\n- `J=1,K=1` obrigatoriamente\n- `J=0,K=1` e clock desabilitado\n> Em JK, para sair de 1 para 0, e necessario resetar ou alternar. A tabela de excitacao resume como `K=1` e `J=X`.\n\n===\n@id sim12-q16\n# simulado 12; bloco 7; banco de registradores portas\n? Um banco de registradores precisa executar uma instrucao `ADD r5,r2,r3` em um ciclo, lendo dois operandos e escrevendo resultado. Qual configuracao minima de portas e adequada?\n* Duas portas de leitura e uma porta de escrita\n- Uma porta de leitura e uma porta de escrita\n- Duas portas de escrita e nenhuma leitura\n- Uma porta unica compartilhada sem multiplexacao temporal\n- Tres portas de leitura e tres portas de escrita obrigatorias\n> ADD precisa ler r2 e r3 simultaneamente e escrever r5 ao final do ciclo.\n\n===\n@id sim12-q17\n# simulado 12; bloco 8; enderecamento base offset\n? Um vetor de words comeca em `r10`. Qual instrucao carrega o elemento de indice 6 em `r3`, considerando indice iniciado em 0?\n- `LDW r3, 6(r10)`\n- `LDW r3, 20(r10)`\n- `STW r3, 24(r10)`\n* `LDW r3, 24(r10)`\n- `LDW r10, 24(r3)`\n> Indice 6 em words de 4 bytes usa deslocamento `6*4=24`.\n\n===\n@id sim12-q18\n# simulado 12; bloco 6; nand versus and cmos\n? Por que uma porta AND CMOS estatica costuma ser feita como NAND seguida de inversor?\n* Porque a rede CMOS simples gera naturalmente uma funcao invertida; a NAND sai direta e o inversor remove a negacao\n- Porque AND nao pode ser implementada com transistores CMOS em nenhuma condicao\n- Porque NAND consome potencia estatica infinita e precisa de inversor para reduzir\n- Porque o inversor transforma NMOS em PMOS fisicamente\n- Porque AND exige memoria interna e NAND nao exige\n> Redes CMOS estaticas naturais implementam a saida como complemento da rede pull-down. NAND e NOR sao portas diretas; AND/OR exigem inversao adicional.\n\n===\n@id sim12-q19\n# simulado 12; bloco 2; canonical sop/pos\n? Se `F(A,B,C,D)=ΠM(0,1,8,9,10,11)`, qual notacao por mintermos e equivalente?\n- `Σm(0,1,8,9,10,11)`\n- `Σm(2,3,4,5,6,7)`\n- `Πm(2,3,4,5,6,7,12,13,14,15)`\n* `Σm(2,3,4,5,6,7,12,13,14,15)`\n- `ΣM(0,1,8,9,10,11)`\n> Em `ΠM` sao listadas as linhas onde F=0. Os mintermos sao o complemento no universo 0..15.\n\n===\n@id sim12-q20\n# simulado 12; bloco 5; ieee valor codificado\n? IEEE 754 simples: sinal 0, expoente armazenado `01111101`, fracao iniciando `100000...`. Qual valor?\n* `0,375`\n- `0,75`\n- `1,5`\n- `3,0`\n- `0,1875`\n> Expoente real: `125-127=-2`. Mantissa: `1,1000...=1,5`. Valor: `1,5*2^-2=0,375`.\n\n===\n@id sim12-q21\n# simulado 12; bloco 7; rom sram dram\n? Qual associacao e correta?\n- ROM e volatil; SRAM precisa de refresh; DRAM nao precisa\n* ROM e nao volatil; SRAM e volatil sem refresh; DRAM e volatil com refresh\n- Todas sao nao volateis\n- SRAM e sempre mais densa que DRAM\n- DRAM usa flip-flop completo por bit como SRAM\n> ROM mantem conteudo sem energia. SRAM guarda com latches/celulas estaticas enquanto energizada. DRAM usa carga em capacitor e precisa refresh.\n\n===\n@id sim12-q22\n# simulado 12; bloco 4; contador modulo e bits\n? Qual e o numero minimo de flip-flops para um contador sincrono modulo 13 e quantos estados nao usados ele tera?\n- `3 FFs` e `5` estados nao usados\n- `4 FFs` e `13` estados nao usados\n- `5 FFs` e `19` estados nao usados\n* `4 FFs` e `3` estados nao usados\n- `13 FFs` e nenhum estado nao usado\n> `2^3=8` nao basta; `2^4=16` basta. Sobra `16-13=3` estados.\n\n===\n@id sim12-q23\n# simulado 12; bloco 1; bcd com carry decimal\n? Some em BCD os dois digitos `58 + 67`. Qual resultado BCD correto?\n- `1100 0101`\n- `0001 0011 0101`\n- `1011 1111`\n- `0001 0010 1111`\n* `0001 0010 0101`\n> Unidades: 8+7=15, corrige com +6, fica 5 e carry 1. Dezenas: 5+6+1=12, corrige com +6, fica 2 e carry 1. Resultado decimal 125: `0001 0010 0101`.\n\n===\n@id sim12-q24\n# simulado 12; bloco 3; fsm mealy sobreposta\n? Uma Mealy detecta padrao `110` com sobreposicao. Para entrada `111010`, quantas vezes a saida deve pulsar 1?\n- `0`\n- `2`\n* `1`\n- `3`\n- `4`\n> Sequencia 111010 contem `110` apenas nas posicoes 2-4. Nao ha outro 110 completo depois.\n\n===\n@id sim12-q25\n# simulado 12; bloco 2; karnaugh sop dificil\n? Minimize em SOP a funcao do mapa abaixo.\n::tabela Mapa de Karnaugh: linhas AB e colunas CD em Gray\n| 00; 01; 11; 10\n| 00; 0; 1; 1; 1\n| 01; 0; 0; 1; 1\n| 11; 1; 1; 0; 0\n| 10; 1; 1; 1; 0\n::fim\n* `F=A'C + AC' + B'D`\n- `F=A'C + AC' + BD`\n- `F=C + B'D`\n- `F=A'B + CD' + AB'`\n- `F=A xor C`\n> A expressao `A'C` cobre os pontos com A=0,C=1; `AC'` cobre A=1,C=0; e `B'D` cobre os pontos restantes com B=0,D=1. Conferindo no mapa, essa combinacao cobre todos os 1s sem cobrir zeros.\n\n===\n@id sim12-q26\n# simulado 12; bloco 8; call ret e fluxo\n? Se uma label e acessada por `BR sub` e dentro dela existe `RET`, qual risco principal?\n- `BR` salva automaticamente o endereco de retorno em `ra`\n- `RET` volta sempre para a instrucao seguinte ao label\n- Nao ha risco porque labels sao funcoes por definicao\n- `RET` e identico a `BR fim`\n* `RET` usa endereco de retorno que nao foi definido por `CALL` nesse caminho\n> Apenas `CALL` prepara o registrador de retorno. `BR` e desvio simples.\n\n===\n@id sim12-q27\n# simulado 12; bloco 5; ieee normalizacao menor que 1\n? Normalize `0,03125` para IEEE 754 simples. Qual expoente armazenado?\n- `125`\n* `122`\n- `127`\n- `132`\n- `5`\n> `0,03125=1/32=2^-5`. Normalizado: `1,0 x 2^-5`. Expoente armazenado: `127-5=122`.\n\n===\n@id sim12-q28\n# simulado 12; bloco 1; gray em sequencia\n? Um sensor envia Gray de 4 bits. Recebe-se `1110`, converte-se para binario natural e soma-se 2. Qual e o novo valor binario de 4 bits?\n- `1011`\n* `1101`\n- `1001`\n- `1100`\n- `1111`\n> Gray 1110 para binario: primeiro bit 1; depois XOR acumulado: 1, 0, 1, 1. Isso e `1011` decimal 11. Somando 2, resulta decimal 13, ou `1101`.\n\n===\n@id sim12-q29\n# simulado 12; bloco 6; potencia dinamica com atividade\n? Um barramento de 32 bits tem capacitancia efetiva de `2 pF` por bit, atividade media `0,15`, `V=1,1 V` e `f=200 MHz`. Qual potencia dinamica aproximada?\n- `23,2 mW`\n- `0,232 mW`\n* `2,32 mW`\n- `4,64 mW`\n- `1,16 mW`\n> Capacitancia total: `64 pF`. `P=0,15*64e-12*1,21*200e6≈2,32 mW`.\n\n===\n@id sim12-q30\n# simulado 12; bloco 3; moore versus mealy\n? Uma saida muda imediatamente quando a entrada X muda, mesmo sem borda de clock, porque a logica de saida usa estado atual e X. Isso caracteriza:\n- Maquina de Moore pura\n* Maquina de Mealy\n- Latch SR proibido\n- Contador assincrono\n- Registrador paralelo sem enable\n> Em Mealy a saida pode depender da entrada atual. Em Moore pura, a saida depende apenas do estado.\n\n===\n@id sim12-q31\n# simulado 12; bloco 7; prom bits de saida\n? Uma PROM implementa 5 entradas e 4 saidas. Quantos bits de tabela de saida sao necessarios?\n- `20 bits`\n- `32 bits`\n* `128 bits`\n- `64 bits`\n- `512 bits`\n> `2^5=32` enderecos. Cada endereco guarda 4 bits de saida. Total `32*4=128 bits`.\n\n===\n@id sim12-q32\n# simulado 12; bloco 4; temporizacao setup com skew favoravel\n? Um caminho tem `tCQmax=0,7 ns`, `tPDmax=5,8 ns`, `tsetup=0,9 ns`. O skew e favoravel em `0,3 ns`. Qual periodo minimo?\n- `7,4 ns`\n* `7,1 ns`\n- `7,7 ns`\n- `6,8 ns`\n- `5,8 ns`\n> Setup: `T >= tCQmax+tPDmax+tsetup-skew_favoravel`. Logo `0,7+5,8+0,9-0,3=7,1 ns`.\n\n===\n@id sim12-q33\n# simulado 12; bloco 5; carry lookahead conceito\n? Em um somador carry-lookahead, se para um bit `Gi=AiBi` e `Pi=Ai xor Bi`, qual expressao de carry seguinte esta correta?\n- `C_{i+1}=P_i + G_i C_i`\n- `C_{i+1}=A_i + B_i + C_i`\n- `C_{i+1}=G_i P_i C_i`\n- `C_{i+1}=P_i xor C_i`\n* `C_{i+1}=G_i + P_i C_i`\n> O carry e gerado se `G_i=1`, ou propagado se `P_i=1` e havia carry de entrada.\n\n===\n@id sim12-q34\n# simulado 12; bloco 2; karnaugh pos com zeros\n? Uma funcao vale 0 em `M(0,2,8,9,10,11)` e nao possui dont cares. Qual POS minimizada e valida?\n- `F=B'D' + AB'`\n- `F=(B'+D')(A+B')`\n- `F=(B)(A'+D)`\n* `F=(B+D)(A'+B)`\n- `F=(A+B+D)`\n> Os zeros `0,2,8,10` formam o grupo `B=0,D=0`, que em POS vira `(B+D)`. Os zeros `8,9,10,11` formam o grupo `A=1,B=0`, que vira `(A'+B)`. Logo `F=(B+D)(A'+B)`.\n\n===\n@id sim12-q35\n# simulado 12; bloco 6; energia por transicao\n? Um no com `C=40 fF` carrega de 0 a `1,0 V`. Energia aproximada retirada da fonte por carga completa em CMOS e proporcional a:\n- `1/2 C V^2 = 20 fJ`\n* `C V^2 = 40 fJ`\n- `C V = 40 fC`\n- `V^2/C = 25 TV^2/F`\n- `2CV^2 = 80 fJ`\n> Na formula dinamica media `P=alpha C V^2 f`, usa-se energia por ciclo 0->1 efetiva como `CV^2` retirada da fonte.\n\n===\n@id sim12-q36\n# simulado 12; bloco 8; formato opcode campos\n? Uma instrucao de 32 bits usa opcode de 6 bits, dois registradores de 5 bits e imediato de 16 bits. Quantos bits sobram para outro campo?\n- `5 bits`\n* `0 bits`\n- `6 bits`\n- `10 bits`\n- `16 bits`\n> `6+5+5+16=32`. Nao sobra bit.\n\n===\n@id sim12-q37\n# simulado 12; bloco 3; sintese de fsm com d\n? Uma FSM tem estados `Q1Q0` e transicoes: `00->10`, `01->00`, `10->11`, `11->01`. Com FF D, quais equacoes estao corretas?\n* `D1=Q0'` e `D0=Q1`\n- `D1=Q0` e `D0=Q1'`\n- `D1=Q1` e `D0=Q0`\n- `D1=Q1 xor Q0` e `D0=Q1'`\n- `D1=Q1+Q0` e `D0=Q1Q0`\n> Proximo estado: 00->10, 01->00, 10->11, 11->01. O bit D1 vale 1 quando Q0=0. O bit D0 vale 1 quando Q1=1.\n\n===\n@id sim12-q38\n# simulado 12; bloco 1; paridade e erro nao detectado\n? Um pacote usa paridade impar em 8 bits de dados. Os dados originais tinham paridade correta. Durante transmissao, dois bits de dados sao invertidos e o bit de paridade nao muda. O receptor deve concluir:\n- O teste sempre falha, pois qualquer erro altera a paridade\n- O receptor consegue localizar os dois bits invertidos\n- O bit de paridade corrige automaticamente um dos erros\n* O teste de paridade ainda pode passar, pois duas inversoes preservam a paridade\n- A paridade impar detecta erros pares e ignora erros impares\n> Paridade simples detecta quantidade impar de inversoes. Duas inversoes mudam a palavra, mas preservam a paridade total.\n\n===\n@id sim12-q39\n# simulado 12; bloco 4; hold com skew desfavoravel\n? Verifique hold: `tCQmin=0,25 ns`, `tPDmin=0,55 ns`, `thold=0,9 ns` e skew desfavoravel de `0,2 ns`. Qual conclusao?\n* Ha violacao de hold de aproximadamente `0,3 ns`\n- Nao ha violacao; sobra `0,1 ns`\n- Ha violacao de setup, nao de hold\n- Nao ha violacao porque o periodo pode ser aumentado\n- Ha violacao de hold de `1,7 ns`\n> Chegada minima efetiva: `0,25+0,55=0,80 ns`. Com skew desfavoravel, requisito vira `0,9+0,2=1,1 ns`. Falta `0,3 ns`.\n\n===\n@id sim12-q40\n# simulado 12; bloco 7; pla versus pal\n? Uma funcao precisa compartilhar o mesmo termo-produto em duas saidas e tambem usar ORs com numeros diferentes de termos. Qual familia classica tende a ser mais flexivel?\n- PAL, pois OR fixo sempre aceita qualquer quantidade de termos\n* PLA, pois permite programar os planos AND e OR\n- PROM, pois nao usa mintermos\n- SRAM, pois e memoria volatil\n- DRAM, pois refresh cria termos-produto automaticamente\n> PLA programa tanto termos-produto quanto conexoes para OR, oferecendo maior flexibilidade que PAL classica.\n\n===\n@id sim12-q41\n# simulado 12; bloco 8; datapath store\n? Para uma instrucao `STW r4, 8(r1)`, qual descricao de datapath esta correta?\n- ULA calcula `r4+8`; memoria le dado e escreve em r1\n- Memoria de instrucao recebe escrita; RegWrite fica ativo\n* ULA calcula `r1+8`; memoria de dados escreve o valor vindo de `r4`; banco de registradores nao recebe escrita\n- O valor de r1 e gravado no endereco contido em r4\n- O PC recebe o dado de r4 como alvo de desvio\n> Store calcula endereco base+offset e grava na memoria o dado lido do registrador fonte. Nao ha write-back em registrador.\n\n===\n@id sim12-q42\n# simulado 12; bloco 6; atraso rc e fanout\n? Uma porta dirige 4 entradas identicas. Se cada entrada adiciona `6 fF` e o proprio fio tem `16 fF`, qual capacitancia de carga aproximada?\n- `24 fF`\n- `22 fF`\n- `64 fF`\n- `10 fF`\n* `40 fF`\n> `Cload=4*6 fF + 16 fF = 40 fF`. Maior fanout aumenta capacitancia e tende a aumentar atraso/potencia.\n\n===\n@id sim12-q43\n# simulado 12; bloco 2; nand universal multinivel\n? Para implementar `F=(A+B')C + DE` em estrutura NAND-NAND, qual transformacao inicial e mais adequada?\n- `F = ((A+B')CDE)'` e ligar tudo em serie\n* `F = ((A+B')C) + DE` e usar a ultima NAND sobre os produtos negados\n- `F = (A+B'+C+D+E)'` e aplicar uma NAND unica\n- `F = ((A+B')' + C')'(D'+E')`\n- `F = A'B C + D'E'` por DeMorgan direto\n> Para NAND-NAND, a forma natural e soma de produtos. Gera-se cada produto negado e a NAND final realiza a soma pelo DeMorgan.\n\n===\n@id sim12-q44\n# simulado 12; bloco 5; subtracao e overflow\n? Em 4 bits complemento de 2, calcule `0110 - 1011`. Qual resultado e overflow?\n- `1011`, sem overflow\n* `1011`, com overflow\n- `0001`, com overflow\n- `1101`, sem overflow\n- `0111`, com overflow\n> `0110=+6` e `1011=-5`. A operacao e `6-(-5)=11`, fora da faixa +7. Resultado de 4 bits fica `1011`, sinal negativo, indicando overflow.\n\n===\n@id sim12-q45\n# simulado 12; bloco 7; cpld versus fpga\n? Qual comparacao e mais adequada?\n* CPLD costuma ser melhor para logica de controle moderada e timing previsivel; FPGA para logica maior e mais flexivel\n- CPLD e sempre maior e mais flexivel que FPGA\n- FPGA implementa apenas memoria, nao logica\n- CPLD e FPGA sao CPUs que executam instrucoes sequenciais por padrao\n- FPGA nao possui flip-flops, apenas portas analogicas\n> CPLDs usam blocos macro e interconexao mais previsivel; FPGAs usam muitos blocos logicos/LUTs, FFs e roteamento flexivel.\n\n===\n@id sim12-q46\n# simulado 12; bloco 4; registrador bidirecional\n? Um registrador de 4 bits esta em `1010`. Em um ciclo desloca para direita com entrada serial 1 no MSB. Qual conteudo final?\n- `0101`\n- `1011`\n* `1101`\n- `1110`\n- `0010`\n> Deslocar para direita: cada bit vai para a posicao menos significativa; entra 1 no MSB. `1010 -> 1101`.\n\n===\n@id sim12-q47\n# simulado 12; bloco 1; checksum modulo 256\n? Um checksum aditivo de 8 bits soma os bytes e guarda apenas o modulo 256. Para bytes `0xE7, 0x39, 0xA2`, qual checksum simples da soma?\n- `0x1C2`\n* `0xC2`\n- `0x42`\n- `0xC1`\n- `0x5E`\n> Soma: `E7+39=120` hexadecimal; `120+A2=1C2`. Em 8 bits, guarda-se modulo 256: `C2`.\n\n===\n@id sim12-q48\n# simulado 12; bloco 3; encoder prioritario com mascaramento\n? Um encoder prioritario 4:2 tem prioridade `I3>I2>I1>I0`. Antes do encoder, `I3` e mascarado por `EN=0`, enquanto `I2=1,I1=1,I0=0`. Qual codigo valido sai?\n- `11` com valido 1\n- `01` com valido 1\n* `10` com valido 1\n- `00` com valido 0\n- `10` com valido 0\n> Como I3 esta mascarado por EN=0, ele nao participa. A maior entrada ativa restante e I2, codigo `10`, valido 1.\n\n===\n@id sim12-q49\n# simulado 12; bloco 2; nor universal e pos\n? Qual forma e naturalmente mais direta para uma implementacao NOR-NOR de dois niveis?\n* `F=(A+B')(C+D)(A'+E)`\n- `F=AB + C'D + AE`\n- `F=(AB)(CD)(AE)`\n- `F=A xor B xor C`\n- `F=A'B + CD'`\n> NOR-NOR combina diretamente com produto de somas (POS): primeira camada gera somas negadas e a segunda NOR realiza o produto.\n\n===\n@id sim12-q50\n# simulado 12; bloco 8; datapath branch\n? Em `BNE r2,r3,label`, se `r2=9` e `r3=4`, o que o controle deve fazer?\n* Como a comparacao indica diferente, selecionar o alvo de branch para o PC\n- Como a flag zero fica 1, seguir para PC+4\n- Escrever 5 em r2 e continuar\n- Ler memoria de dados no endereco label\n- Tratar como CALL e salvar retorno em ra\n> BNE desvia quando os registradores comparados sao diferentes. A unidade de controle escolhe o PC alvo quando a condicao e verdadeira.\n\n===\n@id sim12-q51\n# simulado 12; bloco 5; shifter e multiplicacao\n? Em inteiro sem sinal de 8 bits, `00110110` passa por deslocamento logico a esquerda de 2. Qual resultado e qual cuidado?\n- `00001101`; e divisao por 4 exata\n- `00110110`; deslocamento logico nao altera valor\n- `11110110`; bit de sinal e replicado\n- `01101100`; apenas um deslocamento e feito\n* `11011000`; bits mais significativos descartados podem indicar perda de informacao\n> `00110110 << 2 = 11011000`. Em largura fixa, bits que saem pelo topo sao perdidos.\n\n===\n@id sim12-q52\n# simulado 12; bloco 6; hazard estatico\n? A expressao `F=A'C + AB` pode ter hazard estatico-1 quando A muda e `B=C=1`. Qual termo elimina esse hazard sem alterar a funcao?\n- `A'B`\n- `AC`\n- `A'A`\n* `BC`\n- `B+C`\n> No padrao `X'Y + XZ`, o consenso e `YZ`. Aqui, `Y=C` e `Z=B`, logo `BC`.\n\n===\n@id sim12-q53\n# simulado 12; bloco 3; decoder e enable\n? Um decoder 2x4 ativo alto tem enable ativo baixo `EN_n`. Para `EN_n=0` e entrada `A1A0=10`, qual saida ativa?\n- `Y0=1`\n- `Y1=1`\n- `Y3=1`\n- Nenhuma, pois enable ativo baixo desabilita com 0\n* `Y2=1`\n> Enable ativo baixo significa habilitado quando `EN_n=0`. Entrada `10` seleciona indice 2.\n\n===\n@id sim12-q54\n# simulado 12; bloco 7; lut combinacional\n? Uma LUT de 4 entradas implementa uma funcao que vale 1 em 6 linhas da tabela verdade. Quantos bits de configuracao a LUT precisa armazenar?\n- `4 bits`\n- `6 bits`\n- `10 bits`\n- `32 bits`\n* `16 bits`\n> Uma LUT de k entradas guarda uma tabela com `2^k` bits, independentemente de quantas linhas valem 1. Para 4 entradas, `16`.\n\n===\n@id sim12-q55\n# simulado 12; bloco 4; divisao de frequencia cascata\n? Um contador binario de 6 bits recebe `96 MHz`. Qual frequencia ideal no bit `Q4`, considerando `Q0` como primeiro divisor por 2?\n- `6 MHz`\n- `1,5 MHz`\n- `12 MHz`\n- `48 MHz`\n* `3 MHz`\n> `Q0` divide por 2, `Q1` por 4, ..., `Q4` por `2^5=32`. `96/32=3 MHz`.\n\n===\n@id sim12-q56\n# simulado 12; bloco 5; ula flags combinadas\n? Uma ULA de 8 bits produz resultado `00000000` em uma operacao SUB. Quais flags conceituais certamente ficam ativas/inativas no modelo usual?\n- `Z=0` e `N=1`\n- `Z=1` e `N=1`\n* `Z=1` e `N=0`\n- `Z=0` e `N=0`\n- `Overflow=1` sempre que resultado e zero\n> Resultado zero ativa a flag Z. O bit mais significativo e 0, entao N=0. Overflow depende dos operandos, nao apenas do resultado zero.\n\n===\n@id sim12-q57\n# simulado 12; bloco 2; decoder ativo baixo\n? Um decoder 3x8 tem saidas ativas em zero. Para implementar `F=Σm(1,4,6)`, usando apenas as saidas do decoder e uma porta NAND, quais saidas entram na NAND?\n- `Y0, Y2, Y3, Y5, Y7`\n- `Y1, Y3, Y5`\n- `Y4, Y5, Y6, Y7`\n- `Y0, Y1, Y4`\n* `Y1, Y4, Y6`\n> Saidas ativas baixas produzem 0 no mintermo selecionado. Uma NAND de `Y1,Y4,Y6` vai a 1 quando qualquer um desses mintermos estiver ativo.\n\n===\n@id sim12-q58\n# simulado 12; bloco 6; glitch e registrador\n? Um glitch combinacional curto aparece na entrada D de um flip-flop, mas termina muito antes da borda ativa e D esta estavel no setup/hold. O efeito esperado e:\n- O FF obrigatoriamente alterna a cada glitch\n- O glitch vira memoria permanente na saida Q\n- O clock para de oscilar por causa do glitch\n- O setup time deixa de existir em circuitos com glitch\n* O FF captura apenas o valor estavel na borda; o glitch pode nao afetar o estado\n> Flip-flops amostram em torno da borda ativa. Glitches importam se violarem janela de amostragem ou ativarem logica sensivel antes disso.\n\n===\n@id sim12-q59\n# simulado 12; bloco 2; tri-state e barramento\n? Dois drivers tri-state compartilham um barramento. Driver A esta habilitado e dirige 1; driver B esta desabilitado. Qual estado eletrico/logico do barramento?\n- `Z`, pois existe um driver desabilitado\n- `0`, pois Z equivale a terra\n* `1`, pois o driver desabilitado fica em alta impedancia\n- `X`, pois qualquer Z causa conflito\n- `1/2 VDD`, pois os drivers fazem divisor\n> Alta impedancia significa que o driver desabilitado praticamente nao dirige o barramento. O driver habilitado determina o valor.\n\n===\n@id sim12-q60\n# simulado 12; bloco 2; xor e paridade\n? Uma funcao vale 1 quando ha numero impar de 1s em `A,B,C,D`. Qual expressao representa isso diretamente?\n- `F=(A xor B)(C xor D)`\n- `F=A xnor B xnor C xnor D`\n- `F=AB+CD`\n- `F=A+B+C+D`\n* `F=A xor B xor C xor D`\n> XOR encadeado representa paridade impar: resultado 1 quando a quantidade de entradas 1 e impar.\n\n===\n@id sim13-q01\n# simulado 13; bloco 1; complemento de 2, carry e overflow\n? Considere a soma de dois padrões de 8 bits: `10011010 + 01110100`. O resultado é truncado para 8 bits. Qual alternativa descreve corretamente o padrão final, o carry-out e o overflow assinado?\n- `00001110`, carry-out `0`, overflow assinado `0`\n- `00001110`, carry-out `1`, overflow assinado `1`\n* `00001110`, carry-out `1`, overflow assinado `0`\n- `11101110`, carry-out `0`, overflow assinado `1`\n- `00001110`, carry-out `0`, overflow assinado `1`\n> A soma completa é `0x9A + 0x74 = 0x10E`. Em 8 bits fica `0x0E`, com carry-out 1. Como os operandos assinados têm sinais diferentes, não há overflow assinado.\n\n===\n@id sim13-q02\n# simulado 13; bloco 1; soma bcd com correção\n? Some os dígitos BCD `0101 1000` e `0110 0111`. Considerando correção BCD quando necessário, qual é o resultado?\n- `1011 1111`\n- `0001 0001 1111`\n- `0001 0011 0101`\n- `0001 0101 0010`\n* `0001 0010 0101`\n> Isso representa 58 + 67. Na unidade, 8+7=15 exige +6, gerando 5 e carry decimal. Na dezena, 5+6+1=12 exige +6, gerando 2 e carry para centena. Resultado: 125 em BCD.\n\n===\n@id sim13-q03\n# simulado 13; bloco 1; gray para binário e próximo gray\n? Um contador usa código Gray de 3 bits. O valor observado é `110`. Se o valor binário representado for incrementado em 1, qual deve ser o próximo código Gray?\n* `111`\n- `101`\n- `100`\n- `010`\n- `011`\n> `110` em Gray corresponde ao binário `100`, isto é, 4. O próximo valor é 5, binário `101`, cujo Gray é `111`.\n\n===\n@id sim13-q04\n# simulado 13; bloco 1; ascii, paridade e checksum\n? Considere ASCII padrão para os caracteres `'A'` e `'5'`: `'A'=0x41` e `'5'=0x35`. Usando paridade par por byte e checksum de soma de 8 bits, qual alternativa está correta?\n- Os dois bits de paridade são `1` e o checksum é `0x76`\n- O bit de paridade de `'A'` é `1`, o de `'5'` é `0` e o checksum é `0x35`\n- Os dois bits de paridade são `0` e o checksum é `0x41`\n* Os dois bits de paridade são `0` e o checksum é `0x76`\n- O bit de paridade de `'A'` é `0`, o de `'5'` é `1` e o checksum é `0x76`\n> `0x41` tem dois bits 1 e `0x35` tem quatro bits 1; ambos já têm paridade par, então o bit extra é 0. A soma `0x41+0x35=0x76`.\n\n===\n@id sim13-q05\n# simulado 13; bloco 2; tri-state e contenção\n? Dois drivers tri-state compartilham a mesma linha. No mesmo instante, o driver 1 está habilitado e força `1`; o driver 2 também está habilitado e força `0`. O que ocorre?\n- A linha assume `Z`, pois sinais opostos se anulam\n* Há contenção de barramento, pois dois drivers tentam impor níveis diferentes\n- A linha assume sempre `1`, pois nível alto tem prioridade\n- A linha assume sempre `0`, pois nível baixo tem prioridade\n- A linha vira um `don't care` válido para simplificação lógica\n> Em barramento tri-state, no máximo um driver deve dirigir a linha. Dois drivers habilitados com valores opostos geram contenção.\n\n===\n@id sim13-q07\n# simulado 13; bloco 2; karnaugh com don't care\n? Para `F(A,B,C,D)=Σm(0,2,8,10)`, com `d(1,9)`, qual é uma SOP mínima correta?\n- `B'C'`\n- `A'D'`\n* `B'D'`\n- `B'D' + A'C`\n- `D'`\n> Os mintermos 0, 2, 8 e 10 formam um quarteto em que `B=0` e `D=0` permanecem fixos. Os don't cares não precisam ser usados.\n\n===\n@id sim13-q08\n# simulado 13; bloco 2; hazard e consenso\n? A expressão `F=A'C+AB` deve permanecer em `1` durante uma transição em que `A` muda e `B=C=1`. Qual termo redundante remove o risco estático-1 clássico?\n- `A'B`\n- `AC`\n- `B'C`\n* `BC`\n- `AB'C`\n> Os termos `A'C` e `AB` deixam uma transição perigosa quando `B=C=1`. O termo de consenso é `BC`.\n\n===\n@id sim13-q09\n# simulado 13; bloco 3; mux implementando função\n? A função `F(A,B,C)=Σm(0,1,5,7)` será implementada com MUX 4:1 usando `A,B` como seleção. Quais valores devem alimentar `I0,I1,I2,I3`?\n* `I0=1, I1=0, I2=C, I3=C`\n- `I0=C, I1=0, I2=1, I3=C'`\n- `I0=1, I1=C, I2=0, I3=C'`\n- `I0=0, I1=1, I2=C, I3=C`\n- `I0=C', I1=0, I2=C, I3=1`\n> Para `AB=00`, entram m0 e m1: saída 1. Para `AB=01`, m2 e m3 não entram: 0. Para `AB=10`, só m5 entra: C. Para `AB=11`, só m7 entra: C.\n\n===\n@id sim13-q10\n# simulado 13; bloco 3; decoder ativo baixo\n? Um decoder 3:8 tem saídas ativas em nível baixo: exatamente uma saída `Yk` vai a `0` quando o mintermo k é selecionado; as demais ficam em `1`. Para implementar `F=Σm(1,5,7)`, qual combinação funciona?\n- `F = OR(Y1,Y5,Y7)`\n* `F = NAND(Y1,Y5,Y7)`\n- `F = AND(Y1,Y5,Y7)`\n- `F = NOR(Y1,Y5,Y7)`\n- `F = XOR(Y1,Y5,Y7)`\n> Como a saída selecionada fica em 0, `NAND(Y1,Y5,Y7)` fica 1 quando qualquer um dos mintermos 1, 5 ou 7 ocorre. Fora deles, todos são 1 e o NAND dá 0.\n\n===\n@id sim13-q12\n# simulado 13; bloco 3; mealy com sobreposição\n? Uma máquina Mealy detecta a sequência `10`, emitindo `1` na transição que completa a sequência e permitindo sobreposição. Para a entrada `10110`, qual sequência de saída é gerada, considerando saída a cada bit lido?\n- `00101`\n- `01010`\n* `01001`\n- `00110`\n- `10010`\n> Ao ler 1, a máquina fica aguardando 0. O par 10 ocorre nos bits 1-2 e 4-5, gerando saídas 1 nessas duas transições: `0,1,0,0,1`.\n\n===\n@id sim13-q13\n# simulado 13; bloco 3; equação de próximo estado\n? A tabela mostra o próximo estado `Q1+Q0+`. Qual expressão corresponde a `D1` se a FSM usa flip-flops D?\n::tabela Tabela de transição\n| Q1Q0; X=0; X=1\n| 00; 00; 01\n| 01; 10; 01\n| 10; 00; 11\n| 11; 10; 11\n::fim\n- `D1 = XQ0 + X'Q1`\n- `D1 = Q1Q0 + X`\n- `D1 = X'Q1 + XQ0`\n* `D1 = X'Q0 + XQ1`\n- `D1 = Q1 + Q0`\n> Para `X=0`, o bit `Q1+` acompanha `Q0`. Para `X=1`, acompanha `Q1`. Como em FF D vale `D1=Q1+`, resulta `X'Q0+XQ1`.\n\n===\n@id sim13-q14\n# simulado 13; bloco 4; latch transparente\n? Um latch D ativo alto inicia com `Q=0`. Enquanto `EN=0`, `D` muda para 1. Depois `EN` vai para 1, `D` muda para 0 e então `EN` volta para 0. Qual é o valor final armazenado?\n- `1`, pois D foi 1 antes de EN abrir\n* `0`\n- `Z`, pois o latch fechado fica em alta impedância\n- indefinido, pois D mudou enquanto EN estava ativo\n- alterna entre 0 e 1 a cada mudança de D\n> Com `EN=0`, a mudança inicial de D não passa. Quando `EN=1`, o latch fica transparente e acompanha D. Antes de fechar, D está 0, então Q final fica 0.\n\n===\n@id sim13-q15\n# simulado 13; bloco 4; flip-flop jk\n? Um flip-flop JK inicia em `Q=0`. Em três bordas de subida consecutivas, recebe `JK=10`, depois `11`, depois `01`. Qual é `Q` ao final?\n- `1`\n- indefinido\n- alta impedância\n- mantém o valor inicial por todo o tempo\n* `0`\n> Na primeira borda, `10` seta Q=1. Na segunda, `11` alterna para 0. Na terceira, `01` reseta, permanecendo 0.\n\n===\n@id sim13-q16\n# simulado 13; bloco 4; ring e johnson\n? Com 5 flip-flops, quantos estados úteis são típicos em um ring counter simples e em um Johnson counter, respectivamente?\n* `5` e `10`\n- `10` e `5`\n- `32` e `10`\n- `5` e `32`\n- `32` e `32`\n> Ring counter simples com n FFs usa n estados úteis. Johnson counter usa 2n estados úteis.\n\n===\n@id sim13-q17\n# simulado 13; bloco 4; setup, hold e fmax\n? Um caminho entre dois flip-flops possui `tCQmax=1,2 ns`, `tPDmax=7,3 ns`, `tsetup=0,8 ns`, `tCQmin=0,4 ns`, `tPDmin=0,6 ns` e `thold=1,1 ns`. Sem skew, qual conclusão é correta?\n- `Tclk mínimo=8,5 ns`, `Fmax≈117,6 MHz` e não há violação de hold\n- `Tclk mínimo=9,3 ns`, `Fmax≈10,75 MHz` e há violação de hold\n* `Tclk mínimo=9,3 ns`, `Fmax≈107,5 MHz` e há violação de hold\n- `Tclk mínimo=8,1 ns`, `Fmax≈123,5 MHz` e não há violação de hold\n- `Tclk mínimo=9,3 ns`, `Fmax≈107,5 MHz` e não há violação de hold\n> Setup: `1,2+7,3+0,8=9,3 ns`, então `Fmax≈1/9,3 ns≈107,5 MHz`. Hold: `0,4+0,6=1,0 ns < 1,1 ns`, logo viola hold.\n\n===\n@id sim13-q18\n# simulado 13; bloco 4; skew em setup e hold\n? Em um caminho síncrono, o clock chega `0,5 ns` mais tarde no flip-flop de destino do que no de origem. Considerando essa diferença como skew positivo no destino, qual efeito típico ocorre?\n- Piora setup e ajuda hold\n- Ajuda setup e ajuda hold\n- Piora setup e piora hold\n* Ajuda setup e piora hold\n- Não altera setup nem hold\n> Clock mais tarde no destino aumenta o tempo disponível para o dado chegar na próxima borda, ajudando setup. Mas também aumenta a janela em que o dado antigo precisa permanecer, piorando hold.\n\n===\n@id sim13-q19\n# simulado 13; bloco 5; ponto fixo signed\n? Interprete `11010110` como um valor Q3.4 assinado em complemento de 2. Qual é o valor decimal?\n- `+13,375`\n* `-2,625`\n- `-5,25`\n- `-2,375`\n- `+2,625`\n> Como inteiro de 8 bits em complemento de 2, `11010110` é `-42`. Em Q3.4, divide por `2^4=16`: `-42/16=-2,625`.\n\n===\n@id sim13-q20\n# simulado 13; bloco 5; ieee 754 normalizado\n? Em IEEE 754 simples, considere sinal `0`, expoente `10000001` e fração começando por `010000...` com o restante zero. Qual valor é representado?\n- `2,5`\n- `1,25`\n- `10,0`\n- `4,0`\n* `5,0`\n> Expoente armazenado 129 dá expoente real `129-127=2`. Fração `010...` dá significando `1,25`. Valor: `1,25*2^2=5`.\n\n===\n@id sim13-q21\n# simulado 13; bloco 5; carry, overflow e soma\n? Some `A=1011` e `B=0110` em 4 bits. Qual é o resultado truncado e a interpretação correta sobre carry e overflow assinado?\n* `0001`, carry-out `1` e overflow assinado `0`\n- `0001`, carry-out `1` e overflow assinado `1`\n- `10001`, carry-out `0` e overflow assinado `1`\n- `0001`, carry-out `0` e overflow assinado `0`\n- `1111`, carry-out `1` e overflow assinado `0`\n> 11 + 6 = 17, truncando para 4 bits dá `0001` com carry-out 1. Como signed, `1011=-5` e `0110=+6`; sinais diferentes não geram overflow assinado.\n\n===\n@id sim13-q22\n# simulado 13; bloco 5; subtração unsigned por complemento de 2\n? Em 4 bits, calcule `0011 - 0101` usando complemento de 2 e interprete o carry-out no caso unsigned.\n- `1110` e carry-out `1`, indicando ausência de borrow\n- `0010` e carry-out `0`, indicando borrow\n- `1101` e carry-out `0`, indicando ausência de borrow\n* `1110` e carry-out `0`, indicando borrow em unsigned\n- `0010` e carry-out `1`, indicando ausência de borrow\n> `3-5=-2`, que em 4 bits é `1110`. Em subtração unsigned via `A+~B+1`, carry-out 0 indica borrow.\n\n===\n@id sim13-q23\n# simulado 13; bloco 5; shift lógico e aritmético\n? Considere o padrão `10010110`. Quais são os resultados de deslocar 2 posições à direita usando shift aritmético e shift lógico, respectivamente?\n- `00100101` e `11100101`\n- `11001011` e `01001011`\n* `11100101` e `00100101`\n- `11100101` e `11100101`\n- `00100101` e `00100101`\n> Shift aritmético à direita replica o MSB 1: `10010110 -> 11001011 -> 11100101`. Shift lógico insere zeros: `00100101`.\n\n===\n@id sim13-q26\n# simulado 13; bloco 6; redes nand/nor cmos\n? Para portas CMOS estáticas de 2 entradas, qual associação está correta?\n* NAND: NMOS em série e PMOS em paralelo; NOR: NMOS em paralelo e PMOS em série\n- NAND: NMOS em paralelo e PMOS em série; NOR: NMOS em série e PMOS em paralelo\n- NAND e NOR usam NMOS em série e PMOS em série\n- NAND e NOR usam NMOS em paralelo e PMOS em paralelo\n- NAND não usa rede pull-up; NOR não usa rede pull-down\n> Na rede pull-down, NAND exige condução quando A e B são 1, logo NMOS em série. NOR exige condução quando A ou B é 1, logo NMOS em paralelo. A rede PMOS é dual.\n\n===\n@id sim13-q27\n# simulado 13; bloco 6; potência dinâmica por razão\n? Um nó CMOS muda de uma configuração para outra: a capacitância dobra, a frequência dobra, `VDD` cai de `1,2 V` para `0,9 V` e a atividade não muda. Qual é a razão aproximada `Pnova/Pantiga`?\n- `1,125`\n- `3,00`\n- `4,00`\n* `2,25`\n- `0,5625`\n> A razão é `2 * 2 * (0,9/1,2)^2 = 4 * 0,75^2 = 4 * 0,5625 = 2,25`.\n\n===\n@id sim13-q28\n# simulado 13; bloco 6; energia de capacitor e fonte\n? Uma capacitância de `10 pF` é carregada de `0` a `1 V` por uma fonte ideal. Quais valores aproximados correspondem à energia armazenada no capacitor e à energia retirada da fonte?\n- `10 pJ` armazenados e `5 pJ` retirados da fonte\n- `10 pJ` armazenados e `10 pJ` retirados da fonte\n* `5 pJ` armazenados e `10 pJ` retirados da fonte\n- `5 pJ` armazenados e `5 pJ` retirados da fonte\n- `1 pJ` armazenado e `10 pJ` retirados da fonte\n> A energia armazenada é `1/2.C.V^2 = 5 pJ`. A energia retirada da fonte em uma carga completa é aproximadamente `C.V^2 = 10 pJ`.\n\n===\n@id sim13-q29\n# simulado 13; bloco 6; hazard dinâmico\n? Durante uma transição, a saída deveria mudar uma única vez de `0` para `1`, mas observa-se `0 -> 1 -> 0 -> 1` antes de estabilizar. Qual descrição é mais adequada?\n- Hazard estático-1, pois a saída deveria permanecer em 1\n* Hazard dinâmico, pois a saída deveria mudar uma vez, mas oscila antes de estabilizar\n- Hazard estático-0, pois a saída deveria permanecer em 0\n- Alta impedância, pois a saída alternou entre dois valores\n- Overflow assinado, pois a saída mudou mais de uma vez\n> Hazard dinâmico ocorre quando a saída deveria realizar uma única transição, mas faz múltiplas oscilações por atrasos diferentes nos caminhos.\n\n===\n@id sim13-q30\n# simulado 13; bloco 7; capacidade de memória\n? Uma memória organizada como `64K x 16` possui quantas linhas de endereço e qual capacidade total em bytes?\n- `64` linhas de endereço e `16 KiB`\n- `16` linhas de endereço e `64 KiB`\n- `15` linhas de endereço e `128 KiB`\n- `10` linhas de endereço e `1024 KiB`\n* `16` linhas de endereço e `128 KiB`\n> `64K = 2^16` posições, então são 16 linhas de endereço. Cada palavra tem 16 bits = 2 bytes; total `65536*2 = 128 KiB`.\n\n===\n@id sim13-q31\n# simulado 13; bloco 7; tipos de memória não volátil\n? Qual alternativa diferencia corretamente EPROM, EEPROM e Flash?\n- EPROM é volátil; EEPROM é SRAM; Flash precisa refresh\n- EPROM é apagável eletricamente byte a byte; EEPROM só por luz UV; Flash é DRAM\n- EPROM, EEPROM e Flash são todas memórias voláteis de leitura/escrita dinâmica\n* EPROM é apagável por luz UV; EEPROM é apagável eletricamente; Flash é uma forma de EEPROM organizada para alta densidade/blocos\n- Flash é sempre ROM de máscara e não pode ser regravada\n> EPROM é apagada com ultravioleta; EEPROM e Flash são apagáveis eletricamente. Flash é relacionada à EEPROM, mas organizada para maior densidade e apagamento em blocos.\n\n===\n@id sim13-q32\n# simulado 13; bloco 7; sram e dram\n? Sobre SRAM, DRAM e banco de registradores, assinale a alternativa incorreta.\n* SRAM precisa de refresh periódico porque armazena bits como carga em capacitor\n- DRAM precisa de refresh periódico\n- SRAM é volátil, mesmo sem precisar de refresh\n- DRAM tende a ser mais densa que SRAM\n- Banco de registradores costuma ser menor e mais rápido que memória principal\n> Quem armazena bit como carga em capacitor e precisa refresh é a DRAM. SRAM é volátil, mas não precisa refresh.\n\n===\n@id sim13-q33\n# simulado 13; bloco 7; prom, pla e pal\n? Qual linha associa corretamente os planos programáveis?\n- PROM: AND programável e OR fixo; PLA: AND fixo e OR programável; PAL: AND programável e OR programável\n- PROM: AND e OR fixos; PLA: AND fixo e OR fixo; PAL: memória SRAM\n* PROM: AND fixo e OR programável; PLA: AND programável e OR programável; PAL: AND programável e OR fixo\n- PROM: AND programável e OR programável; PLA: AND fixo e OR programável; PAL: ROM de tabela\n- PROM, PLA e PAL são equivalentes; mudam apenas o encapsulamento\n> PROM se comporta como tabela verdade com decodificação fixa de mintermos e OR programável. PLA programa ambos os planos. PAL programa o AND e fixa o OR.\n\n===\n@id sim13-q34\n# simulado 13; bloco 7; lut\n? Uma LUT de 5 entradas usada para implementar uma função booleana arbitrária precisa de quantos bits de configuração para a tabela?\n- `5`\n* `32`\n- `10`\n- `25`\n- `64`\n> Uma LUT de k entradas precisa guardar uma saída para cada combinação de entrada: `2^k`. Para k=5, são 32 bits.\n\n===\n@id sim13-q35\n# simulado 13; bloco 7; fpga, cpld e asic\n? Sobre FPGA, CPLD e ASIC, assinale a alternativa incorreta.\n- CPLDs tendem a ser úteis para lógica d
